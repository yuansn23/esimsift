\":\"span\",\"marks\":[],\"text\":\"After turning on notifications during installation of your GigSky international data eSIM, you’ll receive alerts when you’re approaching a 0MB balance and when your plan duration is about to expire. Please note that top-ups are valid from the purchase day rather than adding days to your original digital SIM plan. For example, if your plan expires on the 15th of the month, and you buy a 7-day top-up on the 12th, your new expiration date will be the 19th (12 plus 7).\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How do I top up my international eSIM?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-how-does-your-free-esim-plan-work-c1ff3\",\"analyticsKey\":\"How Does Your Free eSIM plan work?\",\"answer\":[{\"_key\":\"b09a751052ee\",\"_type\":\"block\",\"children\":[{\"_key\":\"1b1a1672aa61\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky offers a free 100MB eSIM international data plan to all new customers. No credit is required. Whether you want to test our GigSky or get comfortable with the eSIM service to avoid data roaming, our free eSIM will provide you with cellular data in over 190 countries.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How Does Your Free eSIM plan work?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-how-fast-can-support-help-me-if-i-land-with-no-connection\",\"analyticsKey\":\"How fast can support help me if I land with no connection?\",\"answer\":[{\"_key\":\"868033a6c913\",\"_type\":\"block\",\"children\":[{\"_key\":\"94b895f2bbb3\",\"_type\":\"span\",\"marks\":[],\"text\":\"Support is quick, and the support page is full of how-tos so you can usually fix things yourself in minutes. If you still need a person, there's live chat right in the GigSky app, and the help team is also reachable at support.gigsky.com.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How fast can support help me if I land with no connection?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-how-long-do-i-have-to-install-a-plan-after-buying-it\",\"analyticsKey\":\"How long do I have to install a plan after buying it?\",\"answer\":[{\"_key\":\"1b8751bfe7cb\",\"_type\":\"block\",\"children\":[{\"_key\":\"0349bd5e0f21\",\"_type\":\"span\",\"marks\":[],\"text\":\"You get a full year to install after purchase. So when a discount pops up in the app, you can buy now and install right before your trip, still well within that window.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How long do I have to install a plan after buying it?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-how-much-data-do-i-get-with-gigskys-international-esim-plans-2d94d\",\"analyticsKey\":\"How much data do I get with GigSky’s international eSIM plans?\",\"answer\":[{\"_key\":\"c1c96e1e63aa\",\"_type\":\"block\",\"children\":[{\"_key\":\"5803bbaa34b0\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky offers a range of prepaid data plans ranging from 1GB to unlimited data. Ultimately, it’s simply a case of choosing the right plan based on your expected data usage while traveling abroad. If you need more data, you can purchase a top-up plan to extend your service at any time.  \"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How much data do I get with GigSky’s international eSIM plans?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-how-much-data-do-i-need-for-a-7-14-or-30-day-trip\",\"analyticsKey\":\"How much data do I need for a 7, 14, or 30 day trip?\",\"answer\":[{\"_key\":\"128da8af3d1b\",\"_type\":\"block\",\"children\":[{\"_key\":\"dbc3d177adb9\",\"_type\":\"span\",\"marks\":[],\"text\":\"Light users on WhatsApp, Maps, and a bit of social media run about 500MB a day, so roughly 3.5GB for a week, 7.5GB for two weeks, and 15GB for a month. If you stream music and video daily, you'll likely pass 1GB a day, and at that point an unlimited plan saves you from watching a data meter on vacation.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How much data do I need for a 7, 14, or 30 day trip?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-is-a-local-sim-worth-skipping-for-convenience\",\"analyticsKey\":\"Is a local SIM worth skipping for convenience?\",\"answer\":[{\"_key\":\"3d2a299f2908\",\"_type\":\"block\",\"children\":[{\"_key\":\"ce847b7f70bd\",\"_type\":\"span\",\"marks\":[],\"text\":\"A local SIM usually means waiting until you arrive, finding a kiosk, and sometimes handing over your passport. With GigSky you install before you leave and you're connected the moment you land, everything handled on your phone.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is a local SIM worth skipping for convenience?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-is-gigsky-a-reseller-or-an-actual-mobile-operator\",\"analyticsKey\":\"Is GigSky a reseller or an actual mobile operator?\",\"answer\":[{\"_key\":\"cd20f5934419\",\"_type\":\"block\",\"children\":[{\"_key\":\"f170b21dec19\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky is a mobile operator, not a reseller. That's why your phone auto-connects to the best local network wherever you land, and if a signal issue ever comes up, GigSky fixes it at the source instead of routing you through a third party. Being an operator also keeps the setup simple. You install one eSIM inside the app, with no QR codes to wait on, and reuse that same eSIM on every trip after.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is GigSky a reseller or an actual mobile operator?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-is-gigsky-internet-and-network-coverage-reliable-893f8\",\"analyticsKey\":\"Is GigSky internet and network coverage reliable?\",\"answer\":[{\"_key\":\"31c417971f4e\",\"_type\":\"block\",\"children\":[{\"_key\":\"2a3600ebba38\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes! At GigSky, we’re dedicated to providing high-quality, reliable network coverage so you don't have to rely on Wi-Fi hotspots.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is GigSky internet and network coverage reliable?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-is-it-really-unlimited-and-what-is-fair-use\",\"analyticsKey\":\"Is it really unlimited and what is fair use?\",\"answer\":[{\"_key\":\"97c1809e7bd1\",\"_type\":\"block\",\"children\":[{\"_key\":\"1a83e72317ad\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. You’ll always have data in your paid-for period. Once you use your monthly high-speed allowance, your connection continues at a slower speed for the rest of the month. For full details please see our \"},{\"_key\":\"3e6edf2fded0\",\"_type\":\"span\",\"marks\":[\"e15ab668dbd1\"],\"text\":\"T\u0026Cs\"},{\"_key\":\"4b900f6339ec\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"e15ab668dbd1\",\"_type\":\"link\",\"href\":\"https://gigsky-web.webflow.io/terms-and-conditions/terms-of-service-consumer\",\"openInNewTab\":false}],\"style\":\"normal\"}],\"question\":\"Is it really unlimited and what is fair use?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-is-there-any-refund-policy\",\"analyticsKey\":\"Is there any refund policy?\",\"answer\":[{\"_key\":\"27a9ff98387c\",\"_type\":\"block\",\"children\":[{\"_key\":\"132fe2126003\",\"_type\":\"span\",\"marks\":[],\"text\":\"Refunds are available and evaluated case-by-case. You can submit your request via chat, email, or web form. Approved refunds are processed in 5–7 days.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is there any refund policy?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-benefits-does-an-international-esim-card-offer-87c7a\",\"analyticsKey\":\"What benefits does an international eSIM card offer?\",\"answer\":[{\"_key\":\"0473aad4c968\",\"_type\":\"block\",\"children\":[{\"_key\":\"b5b76dec6468\",\"_type\":\"span\",\"marks\":[],\"text\":\"The list is long, but the two primary benefits are convenience and efficiency. Because there’s no need for a physical SIM, you don’t need to worry about switching, losing, or damaging your temporary eSIM or original SIM card. Plus, eSIM carrier activation is straightforward, and network switching is automated for effortless connectivity. \"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What benefits does an international eSIM card offer?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-countries-does-gigsky-work-in-e5234\",\"analyticsKey\":\"What countries does GigSky work in?\",\"answer\":[{\"_key\":\"4a11d460b30e\",\"_type\":\"block\",\"children\":[{\"_key\":\"0a579f499180\",\"_type\":\"span\",\"marks\":[],\"text\":\"With a GigSky eSIM card, international roaming is supported in over 190 countries. But our commitment to effortless eSIM plans doesn’t end there. You can also stay connected in the air and at sea by purchasing cruise,  \"},{\"_key\":\"d24faa890f8c\",\"_type\":\"span\",\"marks\":[\"293f7ebd11dd\"],\"text\":\"inflight data plans\"},{\"_key\":\"4d217aa36391\",\"_type\":\"span\",\"marks\":[],\"text\":\" and \"},{\"_key\":\"4382e711bc15\",\"_type\":\"span\",\"marks\":[\"fe9e7d8465b6\"],\"text\":\"offshore data plans\"},{\"_key\":\"e7fc17e9788e\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[{\"_key\":\"293f7ebd11dd\",\"_type\":\"link\",\"href\":\"https://www.gigsky.com/data-inflight\",\"openInNewTab\":false},{\"_key\":\"fe9e7d8465b6\",\"_type\":\"link\",\"href\":\"https://www.gigsky.com/data-offshore\",\"openInNewTab\":false}],\"style\":\"normal\"}],\"question\":\"What countries does GigSky work in?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-happens-if-my-payment-fails\",\"analyticsKey\":\"What happens if my payment fails?\",\"answer\":[{\"_key\":\"f5971a65f75e\",\"_type\":\"block\",\"children\":[{\"_key\":\"007d73a2e783\",\"_type\":\"span\",\"marks\":[],\"text\":\"We’ll retry your payment and notify you. Failure after a third attempt will mean your plan will pause until payment is completed.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What happens if my payment fails?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-happens-when-i-cross-a-border\",\"analyticsKey\":\"What happens when I cross a border?\",\"answer\":[{\"_key\":\"efef79b21412\",\"_type\":\"block\",\"children\":[{\"_key\":\"3092db5125c7\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you're on a regional plan and cross into a country that plan covers, GigSky reconnects on its own and you'll barely notice. Cross into a country outside your plan and it won't connect, so you'd need to grab a plan for that country or region.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What happens when I cross a border?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-if-my-esim-it-doesnt-connect\",\"analyticsKey\":\"What if my eSIM it doesn't connect?\",\"answer\":[{\"_key\":\"a35b283da06b\",\"_type\":\"block\",\"children\":[{\"_key\":\"19d9f081045f\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky auto-connects to the best network available. Please confirm your phone is unlocked and eSIM-compatible.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What if my eSIM it doesn't connect?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-is-an-international-esim-and-how-does-it-work-23f40\",\"analyticsKey\":\"What is an international eSIM and how does it work?\",\"answer\":[{\"_key\":\"1043ec3df26c\",\"_type\":\"block\",\"children\":[{\"_key\":\"9da1aa6afb6d\",\"_type\":\"span\",\"marks\":[],\"text\":\"An \"},{\"_key\":\"6df1d1a087f5\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"international eSIM \"},{\"_key\":\"da0d5e319d19\",\"_type\":\"span\",\"marks\":[],\"text\":\"is a digital version of a regular SIM. Installing one allows you to activate a mobile data plan without needing a physical SIM card. With a GigSky eSIM, worldwide travel is supported by our network of 400 partners across 200 countries and regions, 200+ cruise ships and 20+ airlines.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What is an international eSIM and how does it work?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-is-included-in-the-subscription\",\"analyticsKey\":\"What is included in the subscription?\",\"answer\":[{\"_key\":\"4e9e466b1a7e\",\"_type\":\"block\",\"children\":[{\"_key\":\"631f1a4d26eb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Each plan gives you a set amount of high-speed data per month (25GB, 50GB, or 75GB). Even if you use it all, you’ll still have unlimited access at a reduced speed - so you’ll never be cut off.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What is included in the subscription?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-is-my-esim-nickname\",\"analyticsKey\":\"What is my eSIM nickname?\",\"answer\":[{\"_key\":\"1c2b p.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a5919f4e42cd\",\"_type\":\"block\",\"children\":[{\"_key\":\"ee76819b5ebe\",\"_type\":\"span\",\"marks\":[],\"text\":\"Tap the menu icon (3 lines) at the top left of the screen.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a32e0886b42a\",\"_type\":\"block\",\"children\":[{\"_key\":\"fe5fd16fed94\",\"_type\":\"span\",\"marks\":[],\"text\":\"Tap eSIM.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b0a5f71e90d8\",\"_type\":\"block\",\"children\":[{\"_key\":\"027f7c171954\",\"_type\":\"span\",\"marks\":[],\"text\":\"Tap the Nickname field, edit the contents to show the new nickname, and tap Save.\"}],\"level\":1,\"listItem\":\"bullet\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"2a813ec09160\",\"_type\":\"block\",\"children\":[{\"_key\":\"47063e8a5c95\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you have any further questions, please contact GigSky Support at \"},{\"_key\":\"30c1c2bada7f\",\"_type\":\"span\",\"marks\":[],\"text\":\"support@gigsky.com\"},{\"_key\":\"a01859cfe2e5\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What is my eSIM nickname?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-mobile-devices-are-esim-compatible\",\"analyticsKey\":\"What mobile devices are eSIM compatible?\",\"answer\":[{\"_key\":\"479a771d8832\",\"_type\":\"block\",\"children\":[{\"_key\":\"66c659ce43d1\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can find the list of compatible devices, along with the necessary information, \"},{\"_key\":\"639a497a8fcc\",\"_type\":\"span\",\"marks\":[\"5980c288b6b0\"],\"text\":\"here\"},{\"_key\":\"bb1b44af2a58\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"5980c288b6b0\",\"_type\":\"link\",\"href\":\"https://support.gigsky.com/articles/16388636-supported-devices\",\"openInNewTab\":false}],\"style\":\"normal\"}],\"question\":\"What mobile devices are eSIM compatible?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-payment-methods-are-accepted\",\"analyticsKey\":\"What payment methods are accepted?\",\"answer\":[{\"_key\":\"616daf261f92\",\"_type\":\"block\",\"children\":[{\"_key\":\"c9eabbcd8b7f\",\"_type\":\"span\",\"marks\":[],\"text\":\"You can pay with credit cards, crypto currencies and Apple Pay.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What payment methods are accepted?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-should-i-do-if-i-experience-problems-using-my-international-esim-f0943\",\"analyticsKey\":\"What should I do if I experience problems using my international eSIM?\",\"answer\":[{\"_key\":\"86f453dbf90c\",\"_type\":\"block\",\"children\":[{\"_key\":\"7ae4dafe73c9\",\"_type\":\"span\",\"marks\":[],\"text\":\"Double-check your mobile device is running the latest version of the operating system and that your eSIM is turned on and selected for cellular data. If you’re sure your settings are correct and still experiencing problems, contact the GigSky Support team at \"},{\"_key\":\"ecb34e909553\",\"_type\":\"span\",\"marks\":[],\"text\":\"help@gigsky.com\"},{\"_key\":\"f97b3acdfda8\",\"_type\":\"span\",\"marks\":[],\"text\":\". \"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What should I do if I experience problems using my international eSIM?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-what-s-the-refund-policy-if-the-esim-never-works\",\"analyticsKey\":\"What's the refund policy if the eSIM never works?\",\"answer\":[{\"_key\":\"595430e90ac3\",\"_type\":\"block\",\"children\":[{\"_key\":\"51bbc9d30bb8\",\"_type\":\"span\",\"marks\":[],\"text\":\"There's no deadline to request a refund, and approved refunds arrive in 5 to 7 business days. Before requesting one, confirm your phone is unlocked, eSIM compatible, and that the eSIM was installed on strong internet, since that's where most issues start.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"What's the refund policy if the eSIM never works?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-when-does-my-subscription-start\",\"analyticsKey\":\"When does my subscription start?\",\"answer\":[{\"_key\":\"5b6093a76285\",\"_type\":\"block\",\"children\":[{\"_key\":\"af8c63196c4a\",\"_type\":\"span\",\"marks\":[],\"text\":\"Your subscription starts once your payment has cleared.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"When does my subscription start?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-who-are-the-experts-behind-the-written-content-on-our-site-and-what-are-their-qualifications\",\"analyticsKey\":\"Who Are the Experts Behind the Written Content on Our Site, and What Are Their Qualifications?\",\"answer\":[{\"_key\":\"46679c9a85eb\",\"_type\":\"block\",\"children\":[{\"_key\":\"1216b4803735\",\"_type\":\"span\",\"marks\":[],\"text\":\"Our content is crafted by a team of experts who bring a wealth of knowledge and experience in telecommunications, technology, and customer service. Our writers and contributors include:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"820176dabd1d\",\"_type\":\"block\",\"children\":[{\"_key\":\"e06c220d2b18\",\"_type\":\"span\",\"marks\":[],\"text\":\"Telecommunications Engineers: With degrees in telecommunications engineering and years of industry experience, our engineers provide in-depth technical insights and ensure the accuracy of all technical content on our site.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b7806cf544b5\",\"_type\":\"block\",\"children\":[{\"_key\":\"d5df03ffab7d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Tech Journalists: Our team includes seasoned tech journalists who have written for leading technology publications. They bring a keen understanding of the latest trends and developments in the industry, ensuring our content is both informative and current.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"94ac2fd89036\",\"_type\":\"block\",\"children\":[{\"_key\":\"6499b192b8ee\",\"_type\":\"span\",\"marks\":[],\"text\":\"Customer Service Specialists: Our content also benefits from the input of our customer service team, who understand the common issues and questions our customers face. They help create practical guides and FAQs to assist users in navigating our services.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Who Are the Experts Behind the Written Content on Our Site, and What Are Their Qualifications?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-who-are-the-people-behind-our-business\",\"analyticsKey\":\"Who Are the People Behind Our Business?\",\"answer\":[{\"_key\":\"b98e43242efb\",\"_type\":\"block\",\"children\":[{\"_key\":\"cfaaf0a11edf\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky is driven by a dedicated team of professionals committed to delivering exceptional service and innovation. Our leadership team includes:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"f641217bd260\",\"_type\":\"block\",\"children\":[{\"_key\":\"fe56a6c319c6\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Ravi Rishy-Maharaj; Founder and Chief Executive Officer \"},{\"_key\":\"0b05880fff03\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"b599da64cfd0\",\"_type\":\"block\",\"children\":[{\"_key\":\"b97856d4da4c\",\"_type\":\"span\",\"marks\":[],\"text\":\"Ravi Rishy-Maharaj is the founder and CEO of GigSky - the first global mobile data network designed for travelers. Since its inception in 2010, the company has continued to expand its services and partnerships to provide a range of services for consumers, enterprises, and manufacturers. Ravi's career as a serial entrepreneur spans over 25 years in high-tech, where he has led technology and business teams across diverse areas including Mobile, Wireless, Telecom \u0026 Networking, Enterprise Software, and Microelectronics. Ravi graduated with a bachelor's degree in computer engineering from McMaster University and completed post-graduate studies in engineering at McMaster and business administration and economics at York University. He was named as one of McMaster University's Top 150 Engineering Alumni.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"bd8a2347fe1c\",\"_type\":\"block\",\"children\":[{\"_key\":\"b2fbb93dbbcd\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Sam King; Chief Revenue Officer\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"a59d104ba9fe\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc372220fc1\",\"_type\":\"span\",\"marks\":[],\"text\":\"Sam King is GigSky’s Chief Revenue Officer. He is overall responsible for the entirety of GigSky’s revenue across Consumer, Enterprise, and U.S. Government segments. He sets the overall commercial strategy and directly oversees Sales, Marketing and Business Development teams and has dotted-line leadership relationships with the Product and Operations organizations to ensure strategic and operational alignment across the company.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5d8ac593b8ca\",\"_type\":\"block\",\"children\":[{\"_key\":\"9d7a582cf8e8\",\"_type\":\"span\",\"marks\":[],\"text\":\"Before GigSky, Sam co-founded Simless Inc., a digital SIM card company that was acquired by GigSky in 2018. Before co-founding Simless he was a Director of Product Management at AT\u0026T Inc. where he led a team that was responsible for identifying and deploying value-added applications that leveraged the SIM card as a platform.  Sam began his post-MBA career as a management consultant with Capgemini where he concentrated on the Technology, Media, and Telecommunications verticals. Prior to receiving his MBA Sam served five years as an Active-Duty U.S. Army Officer, which included a fifteen-month deployment to Northern Iraq where he focused on the development of the Iraqi Police. Sam has a Bachelor's degree in Economics from Harvard University (cum laude) and a Masters in Business Administration (Beta Gamma Sigma) from Georgetown University. \"},{\"_key\":\"f0c619f3dae6\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"048e85a9edc7\",\"_type\":\"block\",\"children\":[{\"_key\":\"ba2b5effb189\",\"_type\":\"span\",\"marks\":[\"strong\"],\"text\":\"Vikas Chand; VP Global Sales\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"5b75f29ebae2\",\"_type\":\"block\",\"children\":[{\"_key\":\"f3261cd53f2d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Vikas leads GigSky’s Global Enterprise Sales Organization. He is an executive-level opportunity-driven revenue driver with over 30 years of global experience building value and profitability within enterprise, consumer, and government telecom sales. He has an international reputation for leading, high-growth, high-profit, sales and business development initiatives in the US, Europe, Africa, and The Middle East.\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"ae6e9be6275c\",\"_type\":\"block\",\"children\":[{\"_key\":\"1dc35cdbaa72\",\"_type\":\"span\",\"marks\":[],\"text\":\"In 2015 Vikas came to GigSky through the acquisition of Voopii, an enterprise-focused data MVNO that he co-founded. Before Voopii Vikas held executive roles at various satellite and telecommunications companies including serving as the CEO of Africa for Gilat Satcom. Vikas has a Bachelor's degree in International Business from the University of Western Ontario and a Master's in Business Administration from Southeastern University.\"},{\"_key\":\"ae0926907ebd\",\"_type\":\"span\",\"marks\":[],\"text\":\" \"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Who Are the People Behind Our Business?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-why-should-people-trust-our-company\",\"analyticsKey\":\"Why Should People Trust Our Company?\",\"answer\":[{\"_key\":\"316dad4ec35d\",\"_type\":\"block\",\"children\":[{\"_key\":\"ca46216d910a\",\"_type\":\"span\",\"marks\":[],\"text\":\"At GigSky, we understand the importance of staying connected, especially when you're on the go. As a leading provider of global mobile data solutions, we pride ourselves on delivering reliable and secure connectivity through our advanced eSIM technology. Here’s why you can trust us:\"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"1a5c2216f0e9\",\"_type\":\"block\",\"children\":[{\"_key\":\"8b75b7752acf\",\"_type\":\"span\",\"marks\":[],\"text\":\"Proven Expertise: With years of experience in the telecommunications industry, GigSky has built a solid reputation for providing high-quality data services across more than 190 countries. Our partnerships with top-tier network providers ensure that you get the best possible coverage and speed, no matter where you are.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"0fae9b7c464e\",\"_type\":\"block\",\"children\":[{\"_key\":\"909f2d54bad2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Customer-Centric Approach: We prioritize our customers' needs, offering flexible data plans and unparalleled customer support. Our 24/7 live customer care ensures that you can get assistance whenever you need it, through phone or live chat.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"15f037d0c78c\",\"_type\":\"block\",\"children\":[{\"_key\":\"560c07066102\",\"_type\":\"span\",\"marks\":[],\"text\":\"Security and Reliability: As an actual network operator, we manage our own U.S.-based eSIMs, ensuring top-notch security and performance. Unlike resellers, we have direct control over our network and can promptly address any issues that arise.\"}],\"level\":1,\"listItem\":\"number\",\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Why Should People Trust Our Company?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-gigsky-ever-charge-me-for-data-i-didn-t-buy\",\"analyticsKey\":\"Will GigSky ever charge me for data I didn't buy?\",\"answer\":[{\"_key\":\"12476b0433d3\",\"_type\":\"block\",\"children\":[{\"_key\":\"a57294e84eab\",\"_type\":\"span\",\"marks\":[],\"text\":\"No. GigSky runs on prepaid data, so the price you see in the app is the final price. When data runs out, topping up is your call, never an automatic charge.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will GigSky ever charge me for data I didn't buy?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-gigsky-give-me-strong-reliable-coverage-not-just-coverage-on-paper\",\"analyticsKey\":\"Will GigSky give me strong, reliable coverage, not just coverage on paper?\",\"answer\":[{\"_key\":\"3345d5b76a75\",\"_type\":\"block\",\"children\":[{\"_key\":\"c9e106c7c79d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Coverage strength shifts by country and by local 5G availability, so you'll typically see 5G or 4G depending on where you are. Because GigSky runs as a mobile operator, it auto-connects to the strongest local network. Travelers even rely on it in places where connectivity is famously tough, like Cuba.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will GigSky give me strong, reliable coverage, not just coverage on paper?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-it-work-on-my-device\",\"analyticsKey\":\"Will it work on my device?\",\"answer\":[{\"_key\":\"01784e385426\",\"_type\":\"block\",\"children\":[{\"_key\":\"f3d3a00a229d\",\"_type\":\"span\",\"marks\":[],\"text\":\"Your device must be eSIM compatible and unlocked. You can find more details \"},{\"_key\":\"e7fb4b8a09ea\",\"_type\":\"span\",\"marks\":[\"347228842c54\"],\"text\":\"here\"},{\"_key\":\"8e6804d6de33\",\"_type\":\"span\",\"marks\":[],\"text\":\".\"}],\"markDefs\":[{\"_key\":\"347228842c54\",\"_type\":\"link\",\"href\":\"https://support.gigsky.com/articles/16388636-supported-devices\",\"openInNewTab\":false}],\"style\":\"normal\"}],\"question\":\"Will it work on my device?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-my-home-phone-number-still-work-with-an-international-esim-72b32\",\"analyticsKey\":\"Will my home phone number still work with an international eSIM?\",\"answer\":[{\"_key\":\"023fb404d483\",\"_type\":\"block\",\"children\":[{\"_key\":\"36a75464ac76\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. Because GigSky provides you with a data-only eSIM, your phone number doesn’t change. So, you can stay logged into your usual messaging app accounts with uninterrupted access to your contacts and conversations. However, your home network provider may apply additional charges if you make or receive calls or send texts in your destination country without using internet-based apps like WhatsApp and Facebook Messenger.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will my home phone number still work with an international eSIM?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-my-plan-renew-automatically\",\"analyticsKey\":\"Will my plan renew automatically?\",\"answer\":[{\"_key\":\"f1a368678bfe\",\"_type\":\"block\",\"children\":[{\"_key\":\"c5050686a0ee\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. All plans are set to auto-renew at the end of each cycle, and you can switch off auto-renew if you prefer. You’ll also receive an email confirmation each time your renewal payment is successful.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will my plan renew automatically?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-speeds-really-stay-usable-after-3-5gb\",\"analyticsKey\":\"Will speeds really stay usable after 3.5GB?\",\"answer\":[{\"_key\":\"dfd3a622a3ab\",\"_type\":\"block\",\"children\":[{\"_key\":\"7399ee65cfe2\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. Messaging, maps, and browsing work normally. Streaming slows down.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will speeds really stay usable after 3.5GB?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-gigsky-services-will-whatsapp-and-imessage-keep-working-on-my-number\",\"analyticsKey\":\"Will WhatsApp and iMessage keep working on my number?\",\"answer\":[{\"_key\":\"ac187e967509\",\"_type\":\"block\",\"children\":[{\"_key\":\"090776c00cdc\",\"_type\":\"span\",\"marks\":[],\"text\":\"WhatsApp keeps working with your existing number no matter what. For iMessage to work, you'll need to leave your home SIM active.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Will WhatsApp and iMessage keep working on my number?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"dca54051-f498-4030-9ec2-97307ac85414\",\"analyticsKey\":\"How do I request a refund if the eSIM never works?\",\"answer\":[{\"_key\":\"88e1a0fcc54f\",\"_type\":\"block\",\"children\":[{\"_key\":\"3f928df6639e\",\"_type\":\"span\",\"marks\":[],\"text\":\"To request a refund, open the GigSky app, go to Transaction History, select the applicable purchase, and tap Request Refund. We'll review your request based on the details of your purchase and let you know the outcome. If you're unable to submit a request through the app, please contact GigSky Support for assistance.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How do I request a refund if the eSIM never works?\",\"group\":{\"_id\":\"GigSky Services\",\"title\":\"GigSky Services\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-limitations-esim\",\"analyticsKey\":\"Are there any limitations or considerations when using eSIM data plans?\",\"answer\":[{\"_key\":\"8492efdb5627\",\"_type\":\"block\",\"children\":[{\"_key\":\"679dc6926e60\",\"_type\":\"span\",\"marks\":[],\"text\":\"While eSIMs are widely supported, it's essential to ensure that your device is compatible. Additionally, some older devices may not support eSIM technology, so it's crucial to check compatibility before opting for an eSIM data plan. Some carriers may also lock your device, preventing you from using eSIMs. Though locking is not allowed in most countries, when it is done, it almost always comes with post-paid plans where your device is being financed.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Are there any limitations or considerations when using eSIM data plans?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-can-i-install-it-at-home-without-accidentally-activating-it\",\"analyticsKey\":\"Can I install it at home without accidentally activating it?\",\"answer\":[{\"_key\":\"8d9b70b33f70\",\"_type\":\"block\",\"children\":[{\"_key\":\"ffa081272e65\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes. Installing at home is actually the safest move because your connection is stable. If you want to be certain it won't start early, turn the eSIM off in your cellular settings and flip it back on when you land.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Can I install it at home without accidentally activating it?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-how-do-i-set-up-a-gigsky-esim\",\"analyticsKey\":\"How do I set up a GigSky eSIM?\",\"answer\":[{\"_key\":\"fb26752f7809\",\"_type\":\"block\",\"children\":[{\"_key\":\"88b9ee3e5825\",\"_type\":\"span\",\"marks\":[],\"text\":\"Everything happens inside the app. Download the GigSky app, tap your destination, type the country, cruise, or ferry, pick between an unlimited or standard plan, choose your data based on trip length and how you use your phone, then install. No waiting on a QR code by email, though that option exists if you prefer it.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How do I set up a GigSky eSIM?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-how-do-i-transfer-my-existing-number-to-an-esim\",\"analyticsKey\":\"How Do I Transfer My Existing Number to an eSIM?\",\"answer\":[{\"_key\":\"afd285a9863e\",\"_type\":\"block\",\"children\":[{\"_key\":\"e967756bb26d\",\"_type\":\"span\",\"marks\":[],\"text\":\"The great news about using a GigSky data plan is that you don’t have to worry about transferring your existing number! GigSky plans are all data-only, which means you won’t be able to make traditional phone calls or send SMS text messages. This means there’s no new phone number to remember and you don’t have to transfer your phone number from your carrier. \"}],\"markDefs\":[],\"style\":\"normal\"},{\"_key\":\"52942dacfad6\",\"_type\":\"block\",\"children\":[{\"_key\":\"563623322f7e\",\"_type\":\"span\",\"marks\":[],\"text\":\"If you need to receive calls or texts while on your trip, your phone number will still be able to do so – though some fees may apply. If this doesn’t apply to you, the best way to make sure you're not roaming on your domestic service when traveling is to turn off or remove your domestic carrier's SIM/eSIM.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"How Do I Transfer My Existing Number to an eSIM?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-international-roaming\",\"analyticsKey\":\"Is it possible to use an eSIM data plan for international roaming?\",\"answer\":[{\"_key\":\"5cdf3f5989ff\",\"_type\":\"block\",\"children\":[{\"_key\":\"03b0bea7b3eb\",\"_type\":\"span\",\"marks\":[],\"text\":\"Yes, eSIM data plans can be used for international roaming in {country}. GigSky plans will provide high quality, reliable networks and connections at a fraction of the data roaming cost your home carrier will charge.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is it possible to use an eSIM data plan for international roaming?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-is-my-phone-compatible-with-esim\",\"analyticsKey\":\"Is My Phone Compatible with eSIM?\",\"answer\":[{\"_key\":\"3531e3829a4a\",\"_type\":\"block\",\"children\":[{\"_key\":\"12e75b4d0df2\",\"_type\":\"span\",\"marks\":[],\"text\":\"The first step to adopting eSIM technology is to ensure your phone is compatible. Although eSIM adoption is growing, not all devices support this feature.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"Is My Phone Compatible with eSIM?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-when-should-i-install-my-esim-so-it-s-ready-when-i-land\",\"analyticsKey\":\"When should I install my eSIM so it's ready when I land?\",\"answer\":[{\"_key\":\"39802d43f57f\",\"_type\":\"block\",\"children\":[{\"_key\":\"f46a89d1c2bd\",\"_type\":\"span\",\"marks\":[],\"text\":\"Install it a day before you leave or the morning of your trip, while you're on strong home internet. A clean install now means the moment you arrive, you're already connected. Nothing to switch on. If you want to be sure everything works before you go, you can install the free trial and test the setup on that first, then add a paid plan once you know your phone connects fine.\"}],\"markDefs\":[],\"style\":\"normal\"}],\"question\":\"When should I install my eSIM so it's ready when I land?\",\"group\":{\"_id\":\"How eSIMs work\",\"title\":\"How eSIMs work\",\"slug\":null}},{\"_id\":\"faq-how-esims-work-where-can-i-get-esim-plans\",\"analyticsKey\":\"Where Can I Get eSIM Plans?\",\"answer\":[{\"_key\":\"64bab034a27a\",\"_type\":\"block\",\"children\":[{\"_key\":\"bc30808862b7\",\"_type\":\"span\",\"marks\":[],\"text\":\"GigSky is your one-stop-shop for eSIM plans. Whether you’re headed to a single country, off to explore a \"},{\"_key\":\"1d4e120037ef\",\"_type\":\"span\",\"marks\":[\"4e0c08f8942c\"],\"text\":\"particular region\"},{\"_key\":\"6021693c5f2d\",\"_type\":\"span\",\"marks\":[],\"text\":\" or are jet-setting \"},{\"_key\":\"4d1a627fb86c\",\"_type\":\"span\",\"marks\":[\"c362bad364ff\"],\"text\":\"around the world\"},{\"_key\":\"8abc553eecc1\",\"_type\":\"span\",\"marks\":[],\"text\":\", there’s a plan for you. Plans start as low as $3.99 and offer a variety of data options and validity lengths.\"}],\"markDefs\":[{\"_key\":\"4e0c08f8942c\",\"_type\":\"link\",\"href\":\"https://www.gigsky.com/all-regions\",\"openInNewTab\":false},{\"_key\":\"c362bad364ff\",\"_type\":\"link\",\"href\":\"https://gigsky.com/\",\"openInNewTab\":false}],\"style\":\"normal\"},{\"_key\":\"8baa5d9191bf\",\"_type\":\"block\",\"children\":[{\"_key\":\"25369dde21a3\",\"_type\":\"span\",\"marks\":[\"5ccc079d0046\"],\"text\":\"Explore GigSky eSIM Plans\"}],\"markDefs\":[{\"_key\":\"5ccc079d0046\",\"_type\":\"link\",\"href\":\"https://www.gigsky.com/all-countries\",\"openInNewTab\":false}],\"style\":\"normal\"}],\"question\":\"Where Can I Get eSIM Plans?\",\"
