baseURL = "https://www.esimsift.com/"
languageCode = "en-us"
title = "eSIM Sift"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# ==========================================
# SEO/GEO 基础设施：llms.txt（AI 检索可引用）+ catalog.json（机器可读价格库）+ sitemap
# ==========================================
[outputs]
home = ["html", "rss", "llms", "catalog"]

[outputFormats.llms]
mediaType = "text/plain"
baseName = "llms"
isHTML = false

[outputFormats.catalog]
mediaType = "application/json"
baseName = "catalog"
isHTML = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# ==========================================
# 产物目录卫生
#   2026-10-04 真实事故：一个手敲的 `hugo server`（端口 1313 被占，Hugo 自选了
#   55171）把 baseURL 换成了 http://localhost:55171 并写进了 public/ ——
#   136 个文件的 canonical 与 sitemap 全部指向 localhost，且 public/esim-providers/
#   整个目录是空的（写一半被中断）。
#
#   对策是「守卫」而不是「构建前清空」：
#     · scripts/check_dates.py 断言 A —— public/ 里出现 localhost 直接构建失败
#     · 该守卫已接入 npm run check:output
#
#   ★ 曾试过 `hugo --cleanDestinationDir`（先清空再重建），已**撤销**：
#     实测 Hugo 阶段从 57 秒涨到 9 分 13 秒（且随产物变多而恶化：4m17s → 9m13s），
#     代价远大于收益。更糟的是先清空再重建，构建一旦被中断就会留下
#     「已清空、未写完」的半截产物 —— 反而更危险（这也是 check_dates.py
#     断言 C「sitemap 里的每个 URL 都必须真的有产物」的由来）。
#
#   ★ 关于 renderToMemory：Hugo 的 [server] 配置段**只**支持 redirects / headers，
#     没有 renderToMemory 这个键 —— 实测写进去无效（产物照样落盘 928 个文件），
#     只有命令行 flag 生效。所以**不要**指望在配置里防住污染：
#       · 预览一律用 `npm run dev`（已带 --renderToMemory，绝不写 public/）
#       · 不要手敲 `hugo server`；万一敲了，务必再跑一次 `npm run build`
#       · 判据：本地地址栏出现 1313 以外的端口，就已经有产物被污染了
# ==========================================

[params]
  brand = "eSIM Sift"
  tagline = "Compare Travel eSIM Plans & Prices"
  description = "eSIM Sift is an independent eSIM price comparison: real prepaid plans from every major travel eSIM provider, ranked by $/GB and $/day."
  ga4 = "G-J6SXGGEN8L"

  # ==========================================
  # 官方社交 profile —— footer 底部图标 + Organization JSON-LD 的 sameAs（单一事实源）
  # 数组顺序 = 页面展示顺序（**不要改成 map**，map 会按字母序打乱）
  # 新增平台：这里加一项 + 在 partials/social-links.html 的 $icons 里补一个 svg path
  # ==========================================
  [[params.social]]
    key = "facebook"
    label = "Facebook"
    url = "https://www.facebook.com/profile.php?id=61581260589639"
  [[params.social]]
    key = "youtube"
    label = "YouTube"
    url = "https://www.youtube.com/@esimsift"
  [[params.social]]
    key = "tumblr"
    label = "Tumblr"
    url = "https://www.tumblr.com/blog/esimsift"
  [[params.social]]
    key = "x"
    label = "X"
    url = "https://x.com/esimsift"

  # ==========================================
  # 出站流量配置（单一控制点）
  # - 换导流目标：只改 active
  # - rel = "" → follow（自家站，如 Roami）
  # - rel = "sponsored nofollow" → 第三方联盟
  # - country_path 中的 {slug} 取自 data/countries.toml 的 [ISO.slugs.<target>]
  # ==========================================
  [params.outbound]
    active = "roami"

    [params.outbound.targets.roami]
      base = "https://www.roamiapp.com"
      country_path = "/{slug}/"
      label = "View plans on Roami"
      rel = ""
      [params.outbound.targets.roami.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "compare"

    [params.outbound.targets.airalo]
      base = "https://www.airalo.com"
      label = "Check on Airalo"
      rel = "sponsored nofollow"
      [params.outbound.targets.airalo.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.holafly]
      base = "https://esim.holafly.com"
      label = "Check on Holafly"
      rel = "sponsored nofollow"
      [params.outbound.targets.holafly.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.saily]
      base = "https://saily.com"
      label = "Check on Saily"
      rel = "sponsored nofollow"
      [params.outbound.targets.saily.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.yesim]
      base = "https://yesim.app"
      label = "Check on Yesim"
      rel = "sponsored nofollow"
      [params.outbound.targets.yesim.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.ubigi]
      base = "https://www.ubigi.com"
      label = "Check on Ubigi"
      rel = "sponsored nofollow"
      [params.outbound.targets.ubigi.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.roamic]
      base = "https://roamic.com"
      label = "Check on Roamic"
      rel = "sponsored nofollow"
      [params.outbound.targets.roamic.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.alosim]
      base = "https://www.alosim.com"
      label = "Check on aloSIM"
      rel = "sponsored nofollow"
      [params.outbound.targets.alosim.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.nomad]
      base = "https://www.nomadesim.com"
      label = "Check on Nomad"
      rel = "sponsored nofollow"
      # 不加 country_path：Nomad 的逐国 URL 是 /{slug}-eSIM，但 slug 口径并不对齐
      # （本站 turkiye ↔ Nomad 用 turkey），机械拼接会产出 404。与其余 7 家品牌
      # 保持一致，先走 base；逐国深链要等逐国核对 slug 后再开（见 STATUS.md 待办）。
      [params.outbound.targets.nomad.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

    [params.outbound.targets.jetpac]
      base = "https://www.jetpacglobal.com"
      label = "Check on Jetpac"
      rel = "sponsored nofollow"
      # 不加 country_path：官网逐国页形如 /product-details/{slug}-esim，但该站是 SPA
      # —— 2026-10-07 实测：任意路径（含不存在的 slug）都返回 200，页面标题由 slug
      # 现场拼接，价格位回落到 $1 占位。串行复测 49 国时 KE 竟回的是 "Vatican City"，
      # 只有少数国家（如 japan）有真实页面。**状态码 200 在这里毫无证据力**，
      # 故与 nomad 一致只走 base，不做逐国深链。
      [params.outbound.targets.jetpac.utm]
        source = "esimsift"
        medium = "referral"
        campaign = "partner"

# ==========================================
# 语言
#   英文为默认语言，且 defaultContentLanguageInSubdir = false
#   → 英文产物留在根路径（public/…），539 个已收录 URL 零变更
#   → 其他语言落在子目录（public/ja/…）
#   新增语言只需三步：
#     1) 在下方追加一个 [languages.<lang>] 块并显式写 contentDir（不写会静默并入默认语言）
#     2) 新建 content/<lang>/ 与 i18n/<lang>.toml（键名对齐 i18n/en.toml）
#     3) 需要覆盖数据层散文时，新建 data/<lang>/…（键路径与 data/ 对齐，深合并）
# ==========================================
defaultContentLanguageInSubdir = false

[languages.en]
  languageCode = "en-us"
  languageName = "English"
  contentDir = "content/en"
  weight = 1

# 德语站（/de/）
#   · contentDir 必须显式写 —— 不写 Hugo 会「静默」把 content/en 也当成德语内容，
#     结果 /de/ 里全是英文页且不报错，非常难查
#   · languageCode 用 de-de（不是 de）：hreflang 与 og:locale 直接读它
#     （输出 hreflang="de-de" / og:locale="de_DE"）
[languages.de]
  languageCode = "de-de"
  languageName = "Deutsch"
  contentDir = "content/de"
  weight = 2

# 德语站的站点参数覆盖（英文值在顶层 [params] 里）
#   不覆盖的话，德语页的 <meta description> 与页脚标语会是英文
[languages.de.params]
  tagline = "Reise-eSIM-Tarife & Preise vergleichen"
  description = "eSIM Sift ist ein unabhängiger eSIM-Preisvergleich: echte Prepaid-Tarife aller großen Reise-eSIM-Anbieter, sortiert nach $/GB und $/Tag."
