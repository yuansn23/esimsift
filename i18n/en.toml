home__browse_countries = "Browse {{ .n }} countries"
home__country_grid_lead = "Pick a destination to see every provider that covers it side by side — real $/GB and $/day figures, fair-use limits decoded, and the cheapest option flagged. From Japan and the USA to Turkey, Thailand, and across Europe, each country page ranks {{ .providers }} providers with the same honest formulas."
home__faq_a1 = "Across all {{ .countries }} countries we track, the cheapest plan in the database is ${{ .price }}, but that is a small, short-duration plan for one destination. Your real floor price depends on where you are going. <a href=\"{{ .compare }}\">Pick your destination</a> to see every provider's cheapest plan, not one sponsor's headline."
home__faq_a2 = "Most phones made since 2019 support eSIM, including every iPhone XS or later and recent Pixel and Samsung Galaxy models. If your phone is carrier-locked or much older, it may not. Each provider's own compatibility checker is the final word before you buy."
home__faq_a3 = "Roughly 1 to 2 GB per week covers maps, messaging and light browsing, while streaming video or hotspotting a laptop can burn that in a day. Every country page lists the $/GB and $/day for each plan, so you can size the data to your trip instead of buying the headline bundle."
home__faq_a4 = "There is no single winner. The cheapest provider changes from country to country, and some plans bundle 30+ European countries while others are single-country. See our <a href=\"{{ .europe }}\">Europe eSIM comparison</a> and read the fair-use fine print before trusting a best-for-Europe claim."
home__faq_a5 = "Yes. Most plans activate when you land and run for 7, 15 or 30 days, then expire even if data is left over. A few providers sell longer or top-up plans. The validity column on every country page lists the exact window for each plan."
home__faq_a6 = "Both are honest ways to compare value. $/GB is what you pay per gigabyte, best if you know your usage. $/day spreads the plan cost over its validity, best for short trips. We compute both with the same formula for every provider, so nobody can game the comparison."
home__faq_a7 = "Travel eSIMs are prepaid by design — no contract, no monthly bill, no credit check, nothing to cancel. A genuinely free eSIM does not really exist: brands occasionally hand out a tiny trial or a first-order discount, but the allowance is small and short-lived, so it is not something to plan a trip around. The lowest entry price in our database right now is ${{ .price }}."
