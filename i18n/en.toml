esim_providers_single__reading_reviews_none = "{{ .brand }} has no Trustpilot business profile we could verify, so there is no public star rating we can honestly point you at. Sites that quote one are usually repeating {{ .brand }}'s own marketing, or the profile of a similarly named competitor. Judge it instead on the things you can check yourself: the dated prices on this page, the fair-use terms in the plan table, and the refund window in the profile card above."
esim_providers_single__reading_reviews_note = "We do not republish a star rating for {{ .brand }}. The same brand scores differently depending on which Trustpilot domain you land on, the figures move weekly, and an average hides the only part that predicts your trip — the one-star reviews, which cluster on the eSIM failing to connect after landing. Read those, filter for your own destination and weight the last two months. Every number on this page is dated and reproducible; a borrowed score would not be."
