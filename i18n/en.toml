research_price_index__s_averages_2f_per_gb_across_the_d_countries_we_t = "%s averages $%.2f per GB across the %d countries we track there — the cheapest region by a wide margin (%.1f× cheaper than %s at $%.2f). If your trip stays inside a cheap region, bigger data buckets are usually safe value."
research_price_index__s_leads_our_index_at_2f_per_gb_the_cheapest_mete = "%s leads our index at $%.2f per GB — the cheapest metered rate any provider posts there, on the %s plan from %s. %s is next at $%.2f per GB. Both rates come from large buckets; entry-plan prices are on each country's page."
research_price_index__s_sits_last_at_2f_per_gb_roughly_1f_times_the_ch = "%s sits last at $%.2f per GB — roughly %.1f times the cheapest market. Expensive markets are usually small or island destinations with little network competition; a short-validity small bucket, compared on the country page, is normally the better buy there."
research_price_index__which_country_has_the_cheapest_esim_data_per_gb = "Which country has the cheapest eSIM data per GB?"
research_price_index__which_country_is_the_most_expensive_for_esim_dat = "Which country is the most expensive for eSIM data?"
research_price_index__which_region_has_the_cheapest_esim_prices = "Which region has the cheapest eSIM prices?"
research_unlimited_esim__by_daily_rate_total_price_divided_by_validity_da = "By daily rate: total price divided by validity days, taking the cheapest unlimited plan per provider per country from the same dated snapshot. Sticker prices mislead — a 30-day plan at $69 looks pricier than a 7-day at $27.30 until you divide. The same snapshot also powers our price index, so metered and unlimited rankings never mix their numbers."
research_unlimited_esim__how_do_you_compare_unlimited_esim_prices_fairly = "How do you compare unlimited eSIM prices fairly?"
research_unlimited_esim__no_every_unlimited_plan_we_track_carries_a_fair = "No. Every unlimited plan we track carries a fair-use policy that can slow your connection after a threshold or under congestion. Some listings state the threshold explicitly (for example a full-speed daily allowance followed by throttled data); others state nothing at all. We quote each provider's policy verbatim in the fair-use audit — treat an unstated policy as unknown, not as unlimited speed."
research_unlimited_esim__s_its_best_unlimited_rate_works_out_to_2f_per_da = "%s — its best unlimited rate works out to $%.2f per day (%s). The cheapest upfront unlimited listing there is %s at $%.2f for %d days. Daily rates are the only fair cross-country comparison because unlimited plans are sold by validity, not by volume."
research_unlimited_esim__when_is_unlimited_cheaper_than_a_fixed_data_plan = "When is unlimited cheaper than a fixed data plan?"
research_unlimited_esim__when_your_daily_usage_clears_the_break_even_we_c = "When your daily usage clears the break-even. We compute it per country: best unlimited $/day divided by the best metered $/GB. The median across the %d countries we checked is %.1f GB per day — use more than that on a typical day (an evening of video plus maps and music) and unlimited usually wins; use less and a big metered bucket is cheaper. The three-country spread in our break-even section shows how far this moves by market."
research_unlimited_esim__which_country_has_the_cheapest_unlimited_esim = "Which country has the cheapest unlimited eSIM?"
tools_list__how_much_data_do_i_need_for_a_week_abroad = "How much data do I need for a week abroad?"
tools_list__if_the_week_is_mostly_browsing_maps_and_messagin = "If the week is mostly browsing, maps and messaging, yes — 5GB buys roughly %.0f hours of browsing or %.0f hours of navigation. If you stream video daily, no: 5GB is about %.1f hours of SD or %.1f hours of HD video, and a single travel-evening of streaming can burn half of it. Run your real hours through the estimator with the 20%% margin on, and if the total clears 2GB a day, price an unlimited plan too."
tools_list__is_5gb_of_esim_data_enough_for_my_trip = "Is 5GB of eSIM data enough for my trip?"
tools_list__it_depends_on_what_you_do_online_not_how_long_yo = "It depends on what you do online, not how long you travel. At the rates in our table, 5GB covers about %.0f hours of browsing and email or %.0f hours of social scrolling — but only %.1f hours of HD video. Rule of thumb: email-and-maps travelers fit in 1-2GB, a normal mix of browsing, social and music fits 5GB, and daily video streaming pushes past 10GB. The estimator above totals your own hours in seconds."
