compare_matchups__faq_h2 = "Questions about this index"
compare_matchups__faq_q_decided = "How is each matchup decided?"
compare_matchups__faq_a_decided = "Country by country. For every destination where both providers sell a plan, we compare the cheapest plan each one offers there and record who is cheaper; the provider that wins more countries wins the matchup. Every head-to-head we track has its own page so you can check the destination you are actually flying to."
compare_matchups__faq_q_entry_price = "What does “cheaper entry” actually mean?"
compare_matchups__faq_a_entry_price = "The cheapest plan each provider sells in that country — often a small 1 GB starter rather than the plan a traveller would really buy. That is exactly why the full country-by-country table lives on each matchup page: open the country you are going to and the gap for your destination is there."
compare_matchups__faq_q_freshness = "How often are these results updated?"
compare_matchups__faq_a_freshness = "Every figure comes from the dated price snapshot shown on the matchup page itself. When a plan changes the page is recomputed; when nothing changed the date deliberately stays put, because a date that moves on every deploy carries no information."
compare_matchups__faq_q_commission = "Are providers ranked by who pays you the most?"
compare_matchups__faq_a_commission = "No. Commission never enters the sort: every verdict is a literal price comparison, and this index lists every matchup we track whether or not the provider pays. Our methodology and disclosure pages spell out how the site is funded."
