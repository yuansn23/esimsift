esim_providers_single__faq_a_hotspot = "{{ .brand }} sets its hotspot rules at brand level rather than country by country, so one answer covers every market we track. What {{ .brand }} publishes: <strong>{{ .allowance }}</strong>. Tethering traffic is drawn from the same allowance as your phone unless that note says otherwise, so a laptop session drains a metered plan noticeably faster — size the plan for the devices you are actually bringing."
esim_providers_single__faq_a_refund = "{{ .brand }}'s refund terms are quoted in the <a href=\"#support\">support card above</a> — we keep that summary rather than restating it here. The part that actually decides whether you can claim is timing: buy a day or two before departure and install at home, because the withdrawal window normally closes the moment the eSIM is activated. Install early, test the connection, and a problem is still fixable; install at the airport and you have usually spent the right."
esim_providers_single__who_beats_lead = "Another brand sells a comparable plan for less in {{ .n }} of the {{ .total }} markets where we track {{ .brand }}. We put like against like: an identical data allowance and validity where a rival sells one, otherwise the nearest rival plan that covers at least as much data and at least as many days. Every gap below is a real list-price difference from the same dated snapshot, and where nothing is genuinely comparable we list nothing."
esim_providers_single__who_beats_none = "In all {{ .total }} markets where we track {{ .brand }}, no other brand we compare sells a comparable plan for less. That is uncommon and worth knowing before you shop around — but it is a price result, not a recommendation for your trip."
