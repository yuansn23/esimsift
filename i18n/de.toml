guides_single__app_lead = "Geräteunterstützung ist nur die halbe Kompatibilität — der Installationsweg des Anbieters ist die andere Hälfte. {{ .app }} von {{ .total }} erfassten Anbietern installieren über ihre eigene App, was zusätzlich zur eSIM-Hardware eine OS-Version und ein Konto verlangt."
