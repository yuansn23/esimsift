esim_providers_single__who_beats_caveat = "Wie wir abgeglichen haben: zuerst dieselbe Datenmenge und Gültigkeit wie der günstigste Tarif von {{ .brand }} in diesem Markt; verkauft kein Rivale genau diese Kombination, der günstigste Rivalentarif, der mindestens genauso viel Datenvolumen und mindestens genauso viele Tage abdeckt; gibt es auch den nicht, bleibt der Markt weg, statt ungleiche Tarife zu vergleichen. Beide Preise sind datierte Listenpreise vor Rabattcodes und Steuern."
