guides_single__box_intro_costs = "Die fünf günstigsten Reiseziele in unserem Index, gemessen am besten Preis pro Gigabyte, den ein Anbieter dort nennt — der Beweis, dass das Reiseziel den Preis bestimmt, nicht die Technik."
