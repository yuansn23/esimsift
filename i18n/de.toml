esim_providers_single__reading_reviews_none = "{{ .brand }} hat kein Trustpilot-Unternehmensprofil, das wir verifizieren könnten — es gibt also keine öffentliche Sternebewertung, auf die wir dich redlich verweisen können. Seiten, die eine nennen, wiederholen meist das Marketing von {{ .brand }} selbst oder das Profil eines ähnlich benannten Wettbewerbers. Beurteile es stattdessen an dem, was du selbst prüfen kannst: die datierten Preise auf dieser Seite, die Fair-Use-Bedingungen in der Tariftabelle und das Rückgabefenster in der Profilkarte oben."
esim_providers_single__reading_reviews_note = "Wir veröffentlichen keine Sternebewertung für {{ .brand }}. Dieselbe Marke schneidet je nach Trustpilot-Domain unterschiedlich ab, die Werte bewegen sich wöchentlich, und ein Durchschnitt verdeckt genau den Teil, der deine Reise vorhersagt — die Ein-Stern-Bewertungen, die sich auf die eSIM häufen, die nach der Landung keine Verbindung bekommt. Lies diese, filtere nach deinem eigenen Reiseziel und gewichte die letzten zwei Monate. Jede Zahl auf dieser Seite ist datiert und reproduzierbar; eine geliehene Punktzahl wäre es nicht."
