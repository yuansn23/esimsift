research_list__daily_rate_rankings = "Tagespreis-Ranglisten plus Break-even-Analyse gegen Festtarife."
research_list__x_unlimited_plans_audited_short = "%d unlimited-Tarife geprüft · jede Fair-Use-Notiz wörtlich zitiert"
research_list__spread_tail = "mehr in {{ .a }} als in {{ .b }} — jeweils zum besten Länderpreis. Wohin du reist, bestimmt deinen Preis stärker als die Wahl des Anbieters."
research_price_index__is_the_cheapest_country_for_gb_also_the_cheapest = "Ist das günstigste Land bei $/GB auch das günstigste für einen kleinen Tarif?"
research_price_index__no_the_two_rankings_differ_best_gb_rewards_large = "Nein — die beiden Ranglisten unterscheiden sich. Der beste $/GB-Wert belohnt große Kontingente und begünstigt damit Vielnutzer auf längeren Reisen. Für einen Städtereisen-Tarif mit 1-3 GB sortieren Sie die Tabelle Ihres Landes stattdessen nach dem Gesamtpreis: Jede Länderseite listet die Einstiegspreise jedes Anbieters nebeneinander."
research_price_index__s_averages_2f_per_gb_across_the_d_countries_we_t = "%s liegt im Durchschnitt bei $%.2f pro GB über die %d Länder, die wir dort erfassen — die günstigste Region mit großem Abstand (%.1f× günstiger als %s mit $%.2f). Wenn Ihre Reise innerhalb einer günstigen Region bleibt, sind größere Datenkontingente meist ein sicherer Gegenwert."
research_price_index__s_leads_our_index_at_2f_per_gb_the_cheapest_mete = "%s führt unseren Index mit $%.2f pro GB an — der günstigste volumenbasierte Satz, den ein Anbieter dort anbietet, beim Tarif %s von %s. %s folgt mit $%.2f pro GB. Beide Sätze stammen aus großen Kontingenten; die Preise der Einstiegstarife finden Sie auf der Seite jedes Landes."
research_price_index__s_sits_last_at_2f_per_gb_roughly_1f_times_the_ch = "%s liegt ganz hinten mit $%.2f pro GB — rund das %.1f-Fache des günstigsten Marktes. Teure Märkte sind meist kleine Ziele oder Inselziele mit wenig Netzwettbewerb; ein kleines Kontingent mit kurzer Gültigkeit, auf der Länderseite verglichen, ist dort normalerweise der bessere Kauf."
research_price_index__which_country_has_the_cheapest_esim_data_per_gb = "Welches Land hat die günstigsten eSIM-Daten pro GB?"
research_price_index__which_country_is_the_most_expensive_for_esim_dat = "Welches Land ist am teuersten für eSIM-Daten?"
research_price_index__which_region_has_the_cheapest_esim_prices = "Welche Region hat die günstigsten eSIM-Preise?"
research_unlimited_esim__by_daily_rate_total_price_divided_by_validity_da = "Nach Tagespreis: Gesamtpreis geteilt durch die Gültigkeitstage, wobei der günstigste unbegrenzte Tarif je Anbieter und Land aus demselben datierten Snapshot genommen wird. Aushangpreise täuschen — ein 30-Tage-Tarif für $69 wirkt teurer als ein 7-Tage-Tarif für $27,30, bis man teilt. Derselbe Snapshot speist auch unseren Preisindex, sodass volumenbasierte und unbegrenzte Rankings ihre Zahlen nie vermischen."
research_unlimited_esim__how_do_you_compare_unlimited_esim_prices_fairly = "Wie vergleicht man unbegrenzte eSIM-Preise fair?"
research_unlimited_esim__no_every_unlimited_plan_we_track_carries_a_fair = "Nein. Jeder unbegrenzte Tarif, den wir erfassen, enthält eine Fair-Use-Richtlinie, die Ihre Verbindung nach einer Schwelle oder bei Überlastung verlangsamen kann. Manche Einträge nennen die Schwelle ausdrücklich (zum Beispiel ein tägliches Volumen in voller Geschwindigkeit, gefolgt von gedrosselten Daten); andere machen gar keine Angabe. Wir zitieren die Richtlinie jedes Anbieters wörtlich im Fair-Use-Audit — behandeln Sie eine nicht angegebene Richtlinie als unbekannt, nicht als unbegrenzte Geschwindigkeit."
research_unlimited_esim__s_its_best_unlimited_rate_works_out_to_2f_per_da = "%s — sein bester unbegrenzter Satz ergibt $%.2f pro Tag (%s). Der günstigste unbegrenzte Eintrag mit Vorauszahlung dort ist %s bei $%.2f für %d Tage. Tagespreise sind der einzige faire Ländervergleich, da unbegrenzte Tarife nach Gültigkeit und nicht nach Volumen verkauft werden."
research_unlimited_esim__when_is_unlimited_cheaper_than_a_fixed_data_plan = "Wann ist unbegrenzt günstiger als ein Tarif mit festem Datenvolumen?"
research_unlimited_esim__when_your_daily_usage_clears_the_break_even_we_c = "Wenn Ihre tägliche Nutzung die Gewinnschwelle überschreitet. Wir berechnen sie pro Land: bester unbegrenzter $/Tag geteilt durch den besten volumenbasierten $/GB. Der Median über die %d Länder, die wir geprüft haben, liegt bei %.1f GB pro Tag — nutzen Sie an einem typischen Tag mehr davon (ein Abend mit Video plus Karten und Musik), gewinnt meist unbegrenzt; nutzen Sie weniger, ist ein großes volumenbasiertes Kontingent günstiger. Die Spanne über drei Länder in unserem Abschnitt zur Gewinnschwelle zeigt, wie stark sich das je nach Markt verschiebt."
research_unlimited_esim__which_country_has_the_cheapest_unlimited_esim = "Welches Land hat die günstigste unbegrenzte eSIM?"
tools_list__how_much_data_do_i_need_for_a_week_abroad = "Wie viele Daten brauche ich für eine Woche im Ausland?"
tools_list__if_the_week_is_mostly_browsing_maps_and_messagin = "Wenn die Woche überwiegend aus Surfen, Karten und Nachrichten besteht, ja — 5GB reichen für etwa %.0f Stunden Surfen oder %.0f Stunden Navigation. Wenn Sie täglich Videos streamen, nein: 5GB sind etwa %.1f Stunden SD oder %.1f Stunden HD-Video, und ein einziger Reiseabend mit Streaming kann die Hälfte davon verbrauchen. Lassen Sie Ihre tatsächlichen Stunden mit aktivem 20%%-Puffer durch den Schätzer laufen, und wenn die Summe 2GB pro Tag überschreitet, kalkulieren Sie auch einen unbegrenzten Tarif ein."
tools_list__is_5gb_of_esim_data_enough_for_my_trip = "Reichen 5GB eSIM-Daten für meine Reise?"
tools_list__it_depends_on_what_you_do_online_not_how_long_yo = "Das hängt davon ab, was Sie online tun, nicht davon, wie lange Sie reisen. Bei den Werten in unserer Tabelle decken 5GB etwa %.0f Stunden Surfen und E-Mail oder %.0f Stunden Social-Media-Scrollen ab — aber nur %.1f Stunden HD-Video. Faustregel: Reisende mit E-Mail und Karten kommen mit 1-2GB aus, eine normale Mischung aus Surfen, Social Media und Musik passt in 5GB, und tägliches Video-Streaming überschreitet 10GB. Der Schätzer oben summiert Ihre eigenen Stunden in Sekunden."
