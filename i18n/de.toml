research_fair_use_audit__can_i_be_throttled_even_with_unlimited_data = "Kann ich auch mit unbegrenzten Daten gedrosselt werden?"
research_fair_use_audit__fair_use_is_the_provider_s_right_to_slow_down_or = "Fair-Use ist das Recht des Anbieters, Ihre Verbindung zu verlangsamen oder zu steuern — ein tägliches Volumen in voller Geschwindigkeit, eine monatliche Schwelle oder eine Heuristik bei Überlastung. So bleiben Tarife mit 'unbegrenzten Daten' profitabel. Von den %d unbegrenzten Tarifen, die wir erfassen, tragen %d%% einen ausdrücklichen Hinweis im Eintrag; der Rest macht dazu schlicht keine Angabe, was wir als nicht angegeben statt als unbegrenzt einstufen."
research_fair_use_audit__s_state_an_explicit_note_on_every_unlimited_plan = "%s geben einen ausdrücklichen Hinweis zu jedem unbegrenzten Tarif an, den wir bei ihnen erfassen; %s geben einen nur bei einigen Einträgen an. Die Prüftabelle oben zitiert den tatsächlichen Wortlaut jedes Anbieters — wir formulieren eine Richtlinie nie freundlicher um, als sie ist."
