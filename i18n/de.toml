esim_providers_single__who_beats_h2 = "Wer {{ .brand }} beim Preis schlägt und wohin du stattdessen gehst"
esim_providers_single__alternatives_legend = "Jeder Balken ist der Anteil der {{ .n }} Ziele in unserer Datenbank, in denen dieser Anbieter den niedrigsten Preis aller erfassten Marken erzielt; der Bruch wiederholt dieselbe Zahl. Ein kurzer Balken heißt, dass er selten der günstigste ist — nicht, dass er teuer wäre. Vergleiche dort die Spalte Preis pro Gigabyte."
esim_providers_single__faq_a_hotspot = "{{ .brand }} regelt Hotspot auf Markenebene, nicht Land für Land — eine Antwort deckt also alle Märkte ab, die wir erfassen. Was {{ .brand }} veröffentlicht: <strong>{{ .allowance }}</strong>. Hotspot-Verkehr zehrt am selben Kontingent wie das Handy, sofern die Notiz nichts anderes sagt; eine Laptop-Sitzung leert einen Tarif mit Datenvolumen also deutlich schneller — plane den Tarif für die Geräte, die du wirklich mitnimmst."
esim_providers_single__faq_a_refund = "Die Rückgabebedingungen von {{ .brand }} stehen zitiert in der <a href=\"#support\">Support-Karte oben</a> — wir wiederholen die Zusammenfassung hier nicht. Entscheidend dafür, ob du überhaupt einen Anspruch geltend machen kannst, ist der Zeitpunkt: kaufe ein oder zwei Tage vor der Abreise und installiere zu Hause, denn das Widerrufsfenster schließt in der Regel in dem Moment, in dem die eSIM aktiviert wird. Früh installieren, Verbindung testen — dann lässt sich ein Problem noch lösen; erst am Flughafen installieren heißt meist, das Recht ist verbraucht."
esim_providers_single__who_beats_lead = "Eine andere Marke verkauft in {{ .n }} der {{ .total }} Märkte, in denen wir {{ .brand }} erfassen, einen vergleichbaren Tarif günstiger. Wir vergleichen Gleiches mit Gleichem: identisches Datenvolumen und identische Gültigkeit, wo ein Rivale so etwas verkauft, sonst der nächstliegende Rivalentarif, der mindestens genauso viel Datenvolumen und mindestens genauso viele Tage abdeckt. Jede Differenz unten ist ein echter Listenpreisunterschied aus demselben datierten Schnappschuss; wo nichts wirklich vergleichbar ist, listen wir nichts."
esim_providers_single__who_beats_none = "In allen {{ .total }} Märkten, in denen wir {{ .brand }} erfassen, verkauft keine andere verglichene Marke einen vergleichbaren Tarif günstiger. Das ist ungewöhnlich und wissenswert, bevor du weiter suchst — aber es ist ein Preisbefund, keine Empfehlung für deine Reise."
esim_providers_single__who_beats_route = "Die Marke, die {{ .brand }} am häufigsten schlägt, ist {{ .rival }} — vorne in {{ .n }} dieser Märkte. Lies den Test oder öffne ein vollständiges Duell"
