compare_matchups__scoreboard_lead = "Über alle {{ .m }} Duelle hinweg: {{ .n }} Anbieter, sortiert nach den Ländern, die sie gewinnen. Jede Zahl ist direkt aus den Land-für-Land-Vergleichen gezählt — nichts wird gewichtet, kein Anbieter wegen Provision angepasst."
