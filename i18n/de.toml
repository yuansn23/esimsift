home__browse_countries = "{{ .n }} Länder durchsuchen"
home__country_grid_lead = "Wähle ein Reiseziel und sieh jeden Anbieter, der es abdeckt, Seite an Seite — echte $/GB- und $/Tag-Werte, ausgewertete Fair-Use-Grenzen und die günstigste Option markiert. Von Japan und den USA über die Türkei und Thailand bis quer durch Europa: Jede Länderseite sortiert {{ .providers }} Anbieter nach denselben ehrlichen Formeln."
home__faq_a1 = "Über alle {{ .countries }} erfassten Länder hinweg ist der günstigste Tarif in der Datenbank ${{ .price }} — aber das ist ein kleiner Kurzzeittarif für ein einzelnes Reiseziel. Deine echte Preisuntergrenze hängt davon ab, wohin du reist. <a href=\"{{ .compare }}\">Wähle dein Reiseziel</a>, um den günstigsten Tarif jedes Anbieters zu sehen — nicht die Werbezeile eines Sponsors."
home__faq_a2 = "Die meisten Smartphones ab Baujahr 2019 unterstützen eSIM, darunter jedes iPhone XS oder neuer sowie aktuelle Pixel- und Samsung-Galaxy-Modelle. Ist dein Gerät an einen Anbieter gebunden oder deutlich älter, kann es scheitern. Der Kompatibilitätscheck des jeweiligen Anbieters ist vor dem Kauf die letzte Instanz."
home__faq_a3 = "Rund 1 bis 2 GB pro Woche reichen für Karten, Messaging und leichtes Surfen; Videostreaming oder ein per Hotspot verbundenes Notebook verbrauchen das an einem Tag. Jede Länderseite nennt $/GB und $/Tag für jeden Tarif — so passt du das Datenvolumen an deine Reise an, statt das beworbene Paket zu kaufen."
home__faq_a4 = "Einen einzelnen Sieger gibt es nicht. Der günstigste Anbieter wechselt von Land zu Land, und manche Tarife bündeln über 30 europäische Länder, während andere nur ein Land abdecken. Sieh dir unseren <a href=\"{{ .europe }}\">Europa-eSIM-Vergleich</a> an und lies das Fair-Use-Kleingedruckte, bevor du einer Aussage wie „bestes für Europa“ glaubst."
home__faq_a5 = "Ja. Die meisten Tarife starten bei der Landung und laufen 7, 15 oder 30 Tage; danach verfallen sie, auch wenn Datenvolumen übrig ist. Einige Anbieter verkaufen längere Laufzeiten oder Nachbuchen. Die Spalte „Gültigkeit“ auf jeder Länderseite nennt das exakte Zeitfenster je Tarif."
home__faq_a6 = "Beide sind ehrliche Vergleichsmaßstäbe. $/GB ist der Preis pro Gigabyte — ideal, wenn du deinen Verbrauch kennst. $/Tag verteilt die Tarifkosten auf die Laufzeit — ideal für Kurzreisen. Wir berechnen beides für jeden Anbieter mit derselben Formel, damit niemand den Vergleich manipulieren kann."
home__faq_a7 = "Reise-eSIMs sind grundsätzlich Prepaid — kein Vertrag, keine Monatsrechnung, keine Bonitätsprüfung, nichts zu kündigen. Eine wirklich kostenlose eSIM gibt es praktisch nicht: Anbieter verschenken gelegentlich eine Mini-Testversion oder einen Rabatt auf die erste Bestellung, doch das Volumen ist klein und kurzlebig — darauf lässt sich keine Reise planen. Der niedrigste Einstiegspreis in unserer Datenbank liegt aktuell bei ${{ .price }}."
