compare_matchups__scoreboard_note = "„Gewonnene Länder“ zählt Land-für-Land-Siege über alle Duelle eines Anbieters: Dasselbe Land wird für jeden Rivalen gezählt, den er dort schlägt — es ist also eine paarweise Zählung, keine Zahl verschiedener Länder."
compare_matchups__scoreboard_method = "Gleichstände zählen auf beiden Seiten, deshalb gilt gewonnen + verloren + Gleichstand = verglichene Länder. Ein Anbieter ohne gemeinsames Land mit irgendeinem Rivalen erscheint nicht."
compare_matchups__faq_h2 = "Fragen zu diesem Index"
compare_matchups__faq_q_decided = "Wie wird ein Duell entschieden?"
compare_matchups__faq_a_decided = "Land für Land. Für jedes Reiseziel, in dem beide Anbieter einen Tarif verkaufen, vergleichen wir den günstigsten Tarif jedes Anbieters und halten fest, wer günstiger ist; wer mehr Länder gewinnt, gewinnt das Duell. Jedes Duell, das wir erfassen, hat eine eigene Seite — so lässt sich genau das Reiseziel prüfen, das man wirklich anfliegt."
compare_matchups__faq_q_entry_price = "Was heißt „günstigerer Einstieg“ genau?"
compare_matchups__faq_a_entry_price = "Der günstigste Tarif, den ein Anbieter in diesem Land verkauft — oft ein kleiner 1-GB-Einstiegstarif und nicht der Tarif, den eine Reisende wirklich kaufen würde. Genau deshalb steht die vollständige Land-für-Land-Tabelle auf jeder Duell-Seite: das Land öffnen, das man bereist, und die Spanne für dieses Ziel steht da."
compare_matchups__faq_q_freshness = "Wie oft werden diese Ergebnisse aktualisiert?"
compare_matchups__faq_a_freshness = "Jede Zahl stammt aus der datierten Preis-Momentaufnahme, die auf der Duell-Seite selbst ausgewiesen ist. Ändert sich ein Tarif, wird die Seite neu berechnet; ändert sich nichts, bleibt das Datum bewusst stehen — ein Datum, das bei jedem Deployment weiterwandert, trägt keine Information."
compare_matchups__faq_q_commission = "Werden Anbieter danach sortiert, wer am meisten zahlt?"
compare_matchups__faq_a_commission = "Nein. Provision fließt nie in die Sortierung ein: Jedes Urteil ist ein wörtlicher Preisvergleich, und dieser Index listet jedes Duell auf, das wir erfassen — unabhängig davon, ob der Anbieter zahlt. Wie sich die Seite finanziert, steht auf unseren Methodik- und Offenlegungsseiten."
