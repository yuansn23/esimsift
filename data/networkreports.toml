# 各国独立网络数据引用（compare/single.html ⑦b 板块单一事实源）
# 来源纪律：只收录能用真实 URL 核实的条目；agent 返回 "not found" 的国家不编造。
# 三批研究合并规则：直接抓取的完整获奖表 > 搜索 snippet > 二手报道；矛盾条目整体弃用。
# Ookla 报告页脚注禁止商业转载其数据 —— Ookla 条目只做"获奖者+报告期+单个数字"的新闻式归属引用 + 链接，数值细节优先用 Opensignal。
# 字段：
#   ookla_slug      仅当 Ookla Global Index 的 slug 与我们 countries.toml 的 slug 不同时填写
#   ookla_mobile    false = 该市场 Global Index 无移动榜（Macau/Fiji），链接文案切换为宽带
#   ookla_note/url/date  可选的获奖/排名事实（归属引用 + 原文链接）
#   opensignal_title/url/date/facts  Opensignal 国家报告事实（≤3 条）
# 无近期 Opensignal 国家报告（只出 Global Index 链接）：IS GE KE MO CN
# 注：Opensignal 测的是用户平均体验速度（mean），Ookla Speedtest 是中位数（median）——两家数字不可直接互比。

updated = "2026-10-01"
accessed = "October 2026"

[HK]
ookla_slug = "hong-kong-(sar)"
opensignal_title = "Hong Kong, May 2026, Mobile Network Experience Report"
opensignal_url = "https://insights.opensignal.com/reports/2026/05/hongkong/mobile-network-experience"
opensignal_date = "May 2026"
opensignal_facts = [
  "CMHK (China Mobile HK) won Download Speed outright with 88.7 Mbps and 5G Download Speed with 171.7 Mbps, on the way to the biggest haul of the cycle — 7 outright plus 5 joint awards.",
  "CMHK also won 5G Coverage Experience and shared overall Coverage with CSL (8.97 vs 8.95 out of 10).",
  "Time on Network is near-universal everywhere: 3 Hong Kong 99.5%, CSL and SmarTone 99.3% — a statistical tie."
]

