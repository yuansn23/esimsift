# IL FAQ (Deutsch) – erzeugt von scripts/faq_frames_de.py, nicht von Hand ändern.
# Zahlen und Markennamen laufen über {token}; Werte berechnet layouts/partials/faq-live-tokens.html zur Build-Zeit.

[[faq]]
q = "Was ist die günstigste eSIM für Israel?"
a = "{cheap_brand} hält für {country_acc} die Bestmarke: {cheap_plan} für ${cheap_price}. Preis und Gegenwert sind zwei verschiedene Messungen, und pro Gigabyte gewinnt {value_plan} von {value_brand} mit ${value_pergb}/GB. Kaufe für die Reise, die du wirklich machst, und nicht für die niedrigste Zahl auf der Seite."

[[faq]]
q = "Ist unbegrenztes eSIM-Datenvolumen in Israel wirklich unbegrenzt?"
a = "Gedeckelt statt unbegrenzt – die {unl_count} unbegrenzten Tarife für {country_acc} drosseln, sobald das Tagesvolumen aufgebraucht ist. {unl_brand} ist pro Tag am günstigsten mit ${unl_perday}, und die volle Spanne reicht hier über {unl_perday_range}. Vergleiche die Grenzen der Anbieter vor dem Kauf, denn die gedrosselte Geschwindigkeit ist der entscheidende Wert, und bei {unl_brand} ist sie {unl_drop}."

[[faq]]
q = "Airalo oder Holafly für Israel?"
a = "Es kommt auf die Form an – Datenpakete gegen unbegrenzte Tage. {ah_airalo_plan} von Airalo ergibt ${ah_airalo_pergb}/GB für ${ah_airalo_price}, und was du kaufst, ist was du bekommst. Wo Holafly gewinnt, ist die Planbarkeit, ab ${ah_holafly_price} für {ah_holafly_days} Tage (${ah_holafly_perday}/Tag), und wo Airalo gewinnt, ist eine kurze, leichte Reise."

[[faq]]
q = "Brauche ich einen Identitätsnachweis für eine eSIM in Israel?"
a = "Ja – israelisches Recht verlangt für jede SIM-Leitung einen Ausweis, und Reise-eSIMs sind nicht ausgenommen. Der Anbieter sammelt ihn beim Kauf ein, die Frage, die einen Israel-Kauf wirklich entscheidet, ist also, über welches Netz der Tarif läuft, und nicht, wie die Registrierung abläuft."

[[faq]]
q = "Welche Netze nutzen eSIMs in Israel?"
a = "Die Tarife auf dieser Seite laufen über Cellcom, Partner, Pelephone. Unterschiede zeigen sich vor allem außerhalb der großen Städte – die Netz-Spalte in der Haupttabelle zeigt, über welches Netz jeder Tarif läuft."

[[faq]]
q = "Kann eine eSIM Israel und weitere Länder der Region abdecken?"
a = "Nicht mit einem Landestarif allein, weil Tarife für {country_acc} an der Grenze enden. {neighbor} dazu bedeutet ein regionales Paket oder einen zweiten Tarif, und diese Rechnung lohnt sich vor dem Kauf."

[[faq]]
q = "Kann ich eine eSIM in Israel nutzen?"
a = "Ja, und in dieser Hinsicht gibt es keine Besonderheit – keine lokale Registrierung und keine Genehmigung nötig. Von den {plan_count} hier gelisteten Tarifen für {country_acc} ist keiner auf eine bestimmte Region des Landes begrenzt. Kläre die Handy-Frage vor dem Kauf und vergleiche den Rest über den Preis."

[[faq]]
q = "Funktioniert mein Handy mit einer eSIM in Israel?"
a = "Derselbe Test wie überall: Wähle *#06# und suche eine EID-Nummer. Der eSIM-Chip ist bei der Fertigung festgelegt, ein ohne ihn gebautes Handy kann ihn später nicht erhalten, egal wie viele Tarife für {country_acc} wir listen. Mach die zwei Prüfungen und komm zur Tabelle oben zurück."

[[faq]]
q = "Brauche ich eine lokale Nummer in Israel?"
a = "Für Nachrichten und Karten brauchst du keine. Wo Sprache existiert, ist sie app-basiert statt eine echte lokale Nummer – was die meisten Reisenden tatsächlich brauchen. Lass beide Leitungen im Handy und stelle Daten auf die eSIM."

[[faq]]
q = "Was sagen Reisende über eSIMs in Israel?"
a = "Wir führen keine Bewertung für eSIMs in {country_dat}, und das ist eine Entscheidung und kein Versehen. Ein Fünf-Sterne-Schnitt und ein Ein-Stern-Schnitt beschreiben meist verschiedene Reisen statt verschiedene Produkte. Nimm die Tabellen oben als die prüfbare Hälfte und lies Bewertungen für den Rest."
