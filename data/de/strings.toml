"Coverage is a solved problem on all networks; the Brussels-Bruges train has Wi-Fi, so big buckets go unused." = "Die Abdeckung ist in allen Netzen ein gelöstes Problem; der Zug Brüssel–Brügge hat WLAN, große Datenpakete bleiben also ungenutzt."
