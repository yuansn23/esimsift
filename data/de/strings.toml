"German prepaid law requires ID for local SIMs - travel eSIMs skip the Ausweis check." = "Das deutsche Prepaid-Recht verlangt einen Ausweis für lokale SIMs — Reise-eSIMs umgehen die Ausweisprüfung."
"Hong Kong is one market where local prepaid SIMs genuinely beat eSIMs on price - but require physical pickup at convenience stores." = "Hongkong ist einer der wenigen Märkte, in denen lokale Prepaid-SIMs eSIMs beim Preis wirklich schlagen — sie müssen aber in Convenience-Stores abgeholt werden."
"Icelandic data is expensive everywhere; there is no budget hack, only per-GB optimization." = "Isländische Daten sind überall teuer; es gibt keinen Billigtrick, nur Optimierung pro GB."
"Indian rules require passport-linked registration even for travel eSIMs - Airalo and Saily handle it in-app in about two minutes." = "Indische Regeln verlangen selbst für Reise-eSIMs eine passgebundene Registrierung — Airalo und Saily erledigen das in der App in etwa zwei Minuten."
"Indonesia's islands make network choice decisive - Telkomsel dominates outside Java and Bali; cheap Indosat plans drop signal on Lombok." = "Indonesiens Inseln machen die Netzwahl entscheidend — Telkomsel dominiert außerhalb von Java und Bali; günstige Indosat-Tarife verlieren auf Lombok das Signal."
"Indonesian law requires a passport upload for eSIM registration; providers handle it in-app." = "Das indonesische Recht verlangt einen Pass-Upload für die eSIM-Registrierung; die Anbieter erledigen das in der App."
"Israeli law requires ID for all SIMs; travel eSIMs for Israel are surprisingly scarce - check coverage lists before assuming your provider sells one." = "Das israelische Recht verlangt einen Ausweis für alle SIMs; Reise-eSIMs für Israel sind überraschend knapp — prüfe die Abdeckungslisten, bevor du annimmst, dass dein Anbieter eine verkauft."
"Italian law caps tourist SIM validity at 90 days - irrelevant for travel eSIMs, which expire with the plan anyway." = "Italienisches Recht begrenzt die Gültigkeit von Touristen-SIMs auf 90 Tage — für Reise-eSIMs irrelevant, sie laufen ohnehin mit dem Tarif ab."
"Japanese law requires passport verification for local prepaid SIM cards (SoftBank, Docomo, KDDI) - travel eSIMs bypass this entirely." = "Das japanische Recht verlangt eine Passprüfung für lokale Prepaid-SIMs (SoftBank, Docomo, KDDI) — Reise-eSIMs umgehen das komplett."
"Jerusalem's Old City alleys favor Cellcom; Petah Tikva industrial zones are fine everywhere." = "Die Gassen der Altstadt von Jerusalem bevorzugen Cellcom; die Industriezonen von Petach Tikwa sind überall in Ordnung."
"Jio's coverage dwarfs Airtel outside cities; most travel eSIMs ride Airtel - fine for the Golden Triangle, weaker in Ladakh." = "Jios Abdeckung überragt Airtel außerhalb der Städte; die meisten Reise-eSIMs fahren auf Airtel — gut für das Goldene Dreieck, schwächer in Ladakh."
"July and August strain island towers - no plan choice fixes peak-season congestion." = "Juli und August belasten die Inselfunkmasten — keine Tarifwahl behebt die Stoßzeit-Überlastung."
"KT and SK both cap tourist plans at LTE despite the 5G rollout; check whether your plan lists 5G before paying extra." = "KT und SK deckeln ihre Touristentarife trotz 5G-Ausbau weiter bei LTE; prüfe, ob dein Tarif 5G ausweist, bevor du mehr zahlst."
"Kenyan SIM registration requires a passport in person - eSIMs handle it digitally." = "Die kenianische SIM-Registrierung verlangt einen Pass persönlich — eSIMs erledigen das digital."
"Korean carrier apps often demand a local ARS verification - travel eSIMs sidestep this with pre-registered profiles." = "Koreanische Anbieter-Apps verlangen oft eine lokale ARS-Verifizierung — Reise-eSIMs umgehen das mit vorregistrierten Profilen."
"Krakow-to-Zakopane buses cross Play dead zones - Telkomsel-style network checks don't apply; just download offline maps." = "Die Busse von Krakau nach Zakopane durchqueren Funklöcher von Play — Netzwechsel wie bei Telkomsel greifen hier nicht; lade einfach Offline-Karten herunter."
"Lisbon and Porto have 5G on every network; the price gap between them buys nothing in cities." = "Lissabon und Porto haben 5G in jedem Netz; die Preislücke dazwischen bringt dir in Städten nichts."
"Load-shedding hits towers - no SIM choice fixes a power cut, but offline maps soften it." = "Load-Shedding trifft die Funkmasten — keine SIM-Wahl behebt einen Stromausfall, aber Offline-Karten mildern ihn."
"Local SIM registration requires a DNI for residents; tourists need a passport walkthrough - eSIMs skip it all." = "Die lokale SIM-Registrierung verlangt für Einwohner eine DNI; Touristen brauchen einen Pass-Durchlauf — eSIMs sparen sich das alles."
"Macao packs three networks into a tiny area - coverage differences are negligible; buy on price." = "Macau presst drei Netze in eine winzige Fläche — die Abdeckungsunterschiede sind vernachlässigbar; kaufe nach Preis."
"Mainland Portugal is easy for all networks; the Azores and Madeira favor MEO-based plans." = "Das Festland von Portugal ist für alle Netze einfach; die Azoren und Madeira bevorzugen Tarife auf MEO-Basis."
"Malaysian tourist SIMs need passport registration at a counter; eSIMs skip the paperwork entirely." = "Malaysische Touristen-SIMs brauchen eine Passregistrierung am Schalter; eSIMs sparen sich den Papierkram komplett."
"Many Hong Kong eSIMs include Macao at no extra cost; check regional plans before buying a single-country one." = "Viele Hongkong-eSIMs enthalten Macau ohne Aufpreis; prüfe regionale Tarife, bevor du einen Ein-Land-Tarif kaufst."
"Maroc Telecom covers the Atlas trails and Sahara edge; Inwi-based plans end at Marrakech." = "Maroc Telecom deckt die Atlas-Routen und den Rand der Sahara ab; Tarife auf Inwi-Basis enden in Marrakesch."
"Medina alleys in Fes kill signal on every network - offline maps first, data second." = "Die Gassen der Medina von Fès töten das Signal in jedem Netz — zuerst Offline-Karten, dann Daten."
"Mexican law requires CURP/ID registration for local SIMs; travel eSIMs skip the counter visit." = "Das mexikanische Recht verlangt eine CURP-/ID-Registrierung für lokale SIMs; Reise-eSIMs sparen den Gang zum Schalter."
"Milford Sound has no coverage on any network - download before the drive." = "Der Milford Sound hat in keinem Netz Abdeckung — lade vor der Fahrt herunter."
"Mountain regions belong to Magti; twin-SIM phones pair a Magti physical SIM with a travel eSIM for the best of both." = "Die Bergregionen gehören Magti; Dual-SIM-Handys kombinieren eine physische Magti-SIM mit einer Reise-eSIM für das Beste aus beiden Welten."
"Movistar covers the coasts and islands best; Yoigo-based cheap plans roam onto it anyway." = "Movistar deckt die Küsten und Inseln am besten ab; günstige Tarife auf Yoigo-Basis roamen ohnehin dort hinein."
"Orange Holiday packages are strong value at CDG - buy the eSIM online first to skip the counter queue." = "Die Orange-Holiday-Pakete sind am CDG stark im Preis — kaufe die eSIM vorher online, dann sparst du dir die Warteschlange am Schalter."
"Philippine SIM registration requires an ID selfie by law; eSIM purchases include the same step." = "Die philippinische SIM-Registrierung verlangt per Gesetz ein ID-Selfie; eSIM-Käufe enthalten denselben Schritt."
"Play grew from budget brand to coverage leader; all four networks are fine in cities." = "Play hat sich vom Billiganbieter zum Abdeckungsführer entwickelt; in Städten sind alle vier Netze in Ordnung."
"Pocket WiFi rental is Japan's classic connectivity option. It wins for groups of 3 or more, but a solo traveler almost always pays less with an eSIM." = "Pocket-WiFi-Verleih ist Japans Klassiker unter den Konnektivitätsoptionen. Für Gruppen ab 3 Personen gewinnt er, Alleinreisende zahlen mit einer eSIM fast immer weniger."
"Prague is trivial for coverage; castle-heavy rural Bohemia favors T-Mobile." = "Prag ist bei der Abdeckung trivial; das burgenreiche ländliche Böhmen bevorzugt T-Mobile."
"Resort Wi-Fi is metered and slow; an eSIM with a modest bucket beats the hotel's rates." = "Das WLAN im Resort ist limitiert und langsam; eine eSIM mit bescheidenem Datenvolumen schlägt die Raten des Hotels."
"Rural signal follows the M8 - offline maps matter more than network choice on the Ring of Kerry." = "Das ländliche Signal folgt der M8 — auf dem Ring of Kerry zählen Offline-Karten mehr als die Netzwahl."
"STC leads coverage on the Riyadh-Jeddah corridor and the Red Sea projects; Zain-based plans lag in AlUla." = "STC führt bei der Abdeckung auf dem Korridor Riad–Dschidda und bei den Projekten am Roten Meer; Tarife auf Zain-Basis hinken in AlUla hinterher."
"Safaricom covers the Maasai Mara; Airtel-based eSIMs fade outside Nairobi and Mombasa." = "Safaricom deckt die Maasai Mara ab; eSIMs auf Airtel-Basis verblassen außerhalb von Nairobi und Mombasa."
"Saudi tourist eSIMs need passport details; providers verify in-app within minutes." = "Saudi-arabische Touristen-eSIMs brauchen Passdaten; die Anbieter prüfen in der App innerhalb von Minuten."
"Smart and Globe coverage outside Luzon is patchy and complementary - a dual-eSIM phone with one of each is the island-hopper's power move." = "Die Abdeckung von Smart und Globe außerhalb von Luzon ist lückenhaft und komplementär — ein Dual-eSIM-Handy mit je einer davon ist der starke Zug für Inselhüpfer."
"SoftBank's own tourist SIM can only be activated 09:00-21:00 JST; travel eSIMs activate 24/7, which matters for late-night arrivals at Narita or Haneda." = "SoftBanks eigene Touristen-SIM lässt sich nur zwischen 09:00 und 21:00 JST aktivieren; Reise-eSIMs sind 24/7 aktiv — wichtig bei Nachtankunft in Narita oder Haneda."
"Spanish law requires ID for local SIMs; travel eSIMs skip the passport scan entirely." = "Das spanische Recht verlangt einen Ausweis für lokale SIMs; Reise-eSIMs überspringen den Pass-Scan komplett."
"Spark wins the South Island's west coast; 2degrees-based budget plans fade in Fiordland." = "Spark gewinnt die Westküste der Südinsel; günstige Tarife auf 2degrees-Basis verblassen in Fiordland."
"Stadium-district towers congest on event nights; no plan choice fixes that." = "Die Funkmasten im Stadionviertel überlasten an Veranstaltungsabenden; keine Tarifwahl behebt das."
"State-run Kolbi covers the jungles; Claro-based tourist eSIMs lose Osa Peninsula signal." = "Das staatliche Kolbi deckt den Dschungel ab; Touristen-eSIMs auf Claro-Basis verlieren auf der Osa-Halbinsel das Signal."
"Swiss data is Europe's most expensive; Swisscom's Alpine coverage is unmatched, and priced like it." = "Schweizer Daten sind die teuersten Europas; die Alpenabdeckung von Swisscom ist unerreicht — und genauso bepreist."
"Switzerland is NOT in EU roaming - EU eSIMs pay surcharges here; a Swiss-specific plan pays for itself in hours." = "Die Schweiz ist NICHT im EU-Roaming — EU-eSIMs zahlen hier Aufschläge; ein Schweiz-spezifischer Tarif rechnet sich innerhalb von Stunden."
"TIM still owns rural Italy; WindTre-based budget eSIMs can struggle in Umbrian hill towns." = "TIM gehört der ländliche Raum Italiens weiterhin; günstige eSIMs auf WindTre-Basis tun sich in den Hügelstädten Umbriens schwer."
"Taiwan's tourist SIMs are cheap but airport-counter-only; online eSIM prices are close enough that skipping the queue usually wins." = "Taiwans Touristen-SIMs sind günstig, aber nur am Flughafenschalter erhältlich; die Online-Preise für eSIMs liegen nah genug, dass das Überspringen der Warteschlange meist gewinnt."
"Telcel is the only network that covers Chiapas and Oaxaca properly; AT&T-based eSIMs are city-strong, rural-thin." = "Telcel ist das einzige Netz, das Chiapas und Oaxaca richtig abdeckt; eSIMs auf AT&T-Basis sind stark in Städten, dünn auf dem Land."
"Telekom's network is the coverage benchmark; O2-based eSIMs save money but fade outside cities." = "Das Telekom-Netz ist der Abdeckungsmaßstab; eSIMs auf O2-Basis sparen Geld, verblassen aber außerhalb der Städte."
"Telstra is the outback lifeline - Optus covers 98.5% of the population but a fraction of the land; a Telstra-based eSIM matters off the coast." = "Telstra ist die Lebenslinie im Outback — Optus erreicht 98,5 % der Bevölkerung, aber nur einen Bruchteil der Fläche; abseits der Küste zählt eine eSIM auf Telstra-Basis."
"The Big Three share networks - a 'discount' Telus eSIM often runs the same towers as Bell." = "Die Big Three teilen sich die Netze — eine „Rabatt“-eSIM von Telus läuft oft auf denselben Masten wie Bell."
"The country is small and flat - all three networks are effectively equal; buy on price." = "Das Land ist klein und flach — alle drei Netze sind praktisch gleich; kaufe nach Preis."
"The islands are Hrvatski Telekom territory; A1-based plans fade south of Split." = "Die Inseln sind Hrvatski-Telekom-Territorium; Tarife auf A1-Basis verblassen südlich von Split."
"The ring road is covered by all networks; highland F-roads have nothing - offline maps regardless of SIM." = "Die Ringstraße wird von allen Netzen abgedeckt; die Hochland-F-Straßen haben gar nichts — Offline-Karten unabhängig von der SIM."
"Three Ireland covers the west coast best; Vodafone wins the midlands." = "Three Ireland deckt die Westküste am besten ab; Vodafone gewinnt das Mittelland."
"Tourist SIM counters at SJO close by 22:00 - eSIMs activate on landing regardless." = "Die Touristen-SIM-Schalter am SJO schließen um 22:00 — eSIMs aktivieren bei der Landung, egal wann."
"Tourist SIMs are strong value but physical-only at Changi counters; eSIMs win on convenience for 1 AM arrivals." = "Touristen-SIMs sind stark im Preis, am Changi aber nur physisch an den Schaltern erhältlich; bei Ankünften um 1 Uhr nachts gewinnen eSIMs bei der Bequemlichkeit."
"Travel eSIMs for China route through Hong Kong gateways - they need no VPN for Google and WhatsApp, unlike local SIMs." = "Reise-eSIMs für China laufen über Gateways in Hongkong — sie brauchen kein VPN für Google und WhatsApp, anders als lokale SIMs."
"True and DTAC merged networks; most eSIMs land on the combined grid, making 'network choice' marketing mostly moot." = "True und DTAC haben ihre Netze fusioniert; die meisten eSIMs landen im kombinierten Netz, wodurch das Marketing mit der „Netzwahl“ weitgehend gegenstandslos wird."
"Turkcell tourist packages are decent value but airport-only; eSIM prices compete closely online." = "Die Touristenpakete von Turkcell sind ordentlich im Preis, aber nur am Flughafen erhältlich; online konkurrieren eSIM-Preise eng."
"Turkiye blocks some VPN protocols by default - travel eSIMs route internationally and sidestep the block." = "Die Türkei blockiert einige VPN-Protokolle standardmäßig — Reise-eSIMs routen international und umgehen die Sperre."
"Two networks, near-identical Doha coverage - buy on price." = "Zwei Netze, nahezu identische Abdeckung in Doha — kaufe nach Preis."
"UAE tourist SIMs require a passport scan at purchase; eSIMs keep it in-app." = "Touristen-SIMs der VAE verlangen einen Pass-Scan beim Kauf; eSIMs behalten ihn in der App."
"UK 'unlimited' tourist plans from Three throttle video to 1080p - fine on a phone, annoying if you hotspot a laptop." = "Die „Unlimited“-Touristentarife von Three drosseln Video auf 1080p — am Handy in Ordnung, nervig, wenn du einen Laptop per Hotspot versorgst."
"US 'unlimited' travel plans typically throttle after 2-5 GB per day; the fair-use fine print matters more here than anywhere." = "US-amerikanische „Unlimited“-Reisetarife drosseln in der Regel nach 2–5 GB pro Tag; das Kleingedruckte zur Fair-Use-Policy zählt hier mehr als irgendwo sonst."
"Verizon joined travel eSIM support late - most plans still run T-Mobile or AT&T, fine in cities, thinner in national parks." = "Verizon ist beim Reise-eSIM-Support spät eingestiegen — die meisten Tarife laufen weiter über T-Mobile oder AT&T: stark in Städten, dünner in Nationalparks."
"Vietnam requires passport registration for every SIM including eSIMs - expect a quick ID upload during purchase." = "Vietnam verlangt eine Passregistrierung für jede SIM, auch für eSIMs — rechne beim Kauf mit einem kurzen ID-Upload."
"Viettel is the only network that reliably covers Ha Long Bay and northern mountain routes; most travel eSIMs default to it." = "Viettel ist das einzige Netz, das die Halong-Bucht und die Bergrouten im Norden zuverlässig abdeckt; die meisten Reise-eSIMs nutzen es standardmäßig."
"Vivo leads national coverage; TIM-based budget eSIMs struggle in Amazonas." = "Vivo führt bei der nationalen Abdeckung; günstige eSIMs auf TIM-Basis tun sich in Amazonas schwer."
"Vodacom and MTN split the country; Garden Route towns favor Vodacom." = "Vodacom und MTN teilen das Land; die Städte der Garden Route bevorzugen Vodacom."
"Vodafone covers the Mamanucas; Digicel wins the outer islands - inter-island ferries switch networks mid-strait." = "Vodafone deckt die Mamanucas ab; Digicel gewinnt die Außeninseln — Fähren zwischen den Inseln wechseln mitten in der Meerenge das Netz."
"Vodafone covers the Nile valley and Red Sea coast; Sinai inland routes need Etisalat." = "Vodafone deckt das Niltal und die Küste am Roten Meer ab; Routen im Landesinneren des Sinai brauchen Etisalat."

