"Airalo lets you withdraw within 14 days of purchase, but the right expires once the eSIM is activated or used. If an activated eSIM fails because of an Airalo error and cannot be restored, you can claim a replacement or refund within 30 days of the issue. Refunds arrive as Airmoney credit or to the original payment method (up to 30 business days)." = "Airalo erlaubt den Widerruf innerhalb von 14 Tagen nach dem Kauf, doch das Recht erlischt, sobald die eSIM aktiviert oder genutzt wurde. Lässt sich eine aktivierte eSIM wegen eines Fehlers von Airalo nicht wiederherstellen, kannst du innerhalb von 30 Tagen nach dem Problem Ersatz oder Rückerstattung verlangen. Rückerstattungen kommen als Airmoney-Guthaben oder auf die ursprüngliche Zahlungsmethode (bis zu 30 Werktage)."
"Chat (24/7 virtual assistant) and a web contact form; no published support email or phone" = "Chat (24/7 virtueller Assistent) und ein Web-Kontaktformular; keine veröffentlichte Support-E-Mail oder Telefonnummer"
"Holafly gives you up to 6 months from purchase to request a refund. A full change-of-mind refund requires buying direct from Holafly (not a reseller) and never activating the eSIM; device-incompatibility refunds need an unscanned QR code and a screenshot as proof. Connection issues during a trip qualify for full or partial refunds (partial ones may carry a $3.50 administrative fee), paid back to the original payment method within 5-10 business days." = "Holafly gewährt bis zu 6 Monate nach dem Kauf Zeit für einen Rückerstattungsantrag. Eine vollständige Rückerstattung wegen Meinungsänderung setzt voraus, dass du direkt bei Holafly (nicht bei einem Wiederverkäufer) gekauft und die eSIM nie aktiviert hast; bei Geräte-Inkompatibilität brauchst du einen ungescannten QR-Code und einen Screenshot als Nachweis. Verbindungsprobleme während der Reise berechtigen zu vollständigen oder teilweisen Rückerstattungen (teilweise mit $3.50 Bearbeitungsgebühr), ausgezahlt auf die ursprüngliche Zahlungsmethode innerhalb von 5-10 Werktagen."
"Jetpac's Terms & Conditions treat an installed eSIM as used: once it is installed, no refund is offered. The exception is a technical fault that stops the eSIM installing or working - then you can ask for a refund or a replacement, and the request must be made within 30 days of purchase. Unused data left when a plan's validity period ends is not refunded or compensated." = "Jetpacs Allgemeine Geschäftsbedingungen behandeln eine installierte eSIM als genutzt: Nach der Installation gibt es keine Rückerstattung. Ausnahme ist ein technischer Defekt, der die Installation oder Funktion der eSIM verhindert — dann kannst du Rückerstattung oder Ersatz verlangen, und der Antrag muss innerhalb von 30 Tagen nach dem Kauf gestellt werden. Ungenutztes Datenvolumen am Ende der Gültigkeit wird nicht erstattet oder ausgeglichen."
"Live chat (website and in-app) and email, available 24 hours a day, 365 days a year; phone +1 877-278-3625" = "Live-Chat (Website und App) und E-Mail, rund um die Uhr an 365 Tagen im Jahr; Telefon +1 877-278-3625"
"Nomad lets you ask for a refund or a change before the eSIM is installed or activated; after activation it refunds only when the fault is a technical problem originating from Nomad. Whether a given plan qualifies is stated in that plan's own description, so check it before buying. Complaints go through the Help Center in the app or website, or by email to hello-cs@getnomad.app." = "Bei Nomad kannst du vor der Installation oder Aktivierung der eSIM eine Rückerstattung oder Änderung verlangen; nach der Aktivierung wird nur erstattet, wenn der Fehler ein technisches Problem von Nomad ist. Ob ein Tarif dafür in Frage kommt, steht in der Beschreibung des jeweiligen Tarifs — prüfe das vor dem Kauf. Beschwerden laufen über das Help Center in der App oder auf der Website oder per E-Mail an hello-cs@getnomad.app."
"Refunds can be requested within 30 days of activation and while the data package is still valid. Unused packages are refunded in full and barely-used ones (under about 1% of data consumed) partially, all via Saily's self-service refund center; if you can't install the eSIM within 30 days you can also get a refund." = "Rückerstattungen lassen sich innerhalb von 30 Tagen nach der Aktivierung beantragen, solange das Datenpaket noch gültig ist. Ungenutzte Pakete werden vollständig erstattet, kaum genutzte (unter etwa 1 % verbrauchtem Datenvolumen) teilweise — alles über Sailys Selbstbedienungs-Erstattungscenter; kannst du die eSIM nicht innerhalb von 30 Tagen installieren, ist ebenfalls eine Rückerstattung möglich."
"Roami's worry-free refund policy promises a full refund if the plan doesn't work or remains unused. The same 24/7 team handles activation, refunds and travel questions." = "Roamis sorgenfreie Rückgaberichtlinie verspricht eine vollständige Rückerstattung, wenn der Tarif nicht funktioniert oder ungenutzt bleibt. Dasselbe 24/7-Team kümmert sich um Aktivierung, Rückerstattungen und Reisefragen."
"Roamic's homepage promises a no-questions-asked refund if your eSIM goes unused within 6 months. The formal policy notes eSIMs are digital products that can't be returned once purchased, and sends buyers with problems to the support team (chat or email), who handle refunds without hassle when a plan must be changed." = "Roamics Startseite verspricht eine Rückerstattung ohne Rückfragen, wenn deine eSIM innerhalb von 6 Monaten ungenutzt bleibt. Die formale Richtlinie weist darauf hin, dass eSIMs digitale Produkte sind, die nach dem Kauf nicht zurückgegeben werden können, und verweist Betroffene an das Support-Team (Chat oder E-Mail), das Rückerstattungen unkompliziert abwickelt, wenn ein Tarif gewechselt werden muss."
"Ubigi data plans are non-refundable once use has started — even partially used. Any refund must be requested within 15 days of payment and only applies to completely unused plans. Monthly plans carry a 3-month minimum commitment before cancellation." = "Ubigi-Datentarife sind nicht erstattungsfähig, sobald die Nutzung begonnen hat — auch bei teilweiser Nutzung. Eine Rückerstattung muss innerhalb von 15 Tagen nach der Zahlung beantragt werden und gilt nur für vollständig ungenutzte Tarife. Monatstarife haben eine Mindestlaufzeit von 3 Monaten vor der Kündigung."
"Yesim refunds only completely unused and unactivated services, requested within 30 days of purchase. Technical-issue refunds must be reported within 1 hour of the failure and can take up to 15 business days to review. Amounts of €10 or less may be paid in Ycoins loyalty credit instead of cash." = "Yesim erstattet nur vollständig ungenutzte und nicht aktivierte Dienste, beantragt innerhalb von 30 Tagen nach dem Kauf. Rückerstattungen wegen technischer Probleme müssen innerhalb von 1 Stunde nach dem Fehler gemeldet werden und können bis zu 15 Werktage zur Prüfung dauern. Beträge von €10 oder weniger können statt in bar als Ycoins-Treueguthaben ausgezahlt werden."
"aloSIM offers a 30-day money-back guarantee: a full refund if you can't install the eSIM or hit connectivity issues, including discovering your device isn't eSIM-compatible. You need your original receipt, and the team may ask why you're requesting the refund." = "aloSIM bietet eine 30-Tage-Geld-zurück-Garantie: vollständige Rückerstattung, wenn du die eSIM nicht installieren kannst oder Verbindungsprobleme auftreten — auch wenn sich zeigt, dass dein Gerät nicht eSIM-fähig ist. Du brauchst deinen ursprünglichen Beleg, und das Team fragt möglicherweise nach dem Grund."
"Airport SIM counters at Suvarnabhumi run 24/7 with aggressive tourist pricing - the rare case where physical SIMs compete on the spot." = "Die SIM-Schalter am Suvarnabhumi sind 24/7 besetzt und fahren aggressive Touristenpreise — der seltene Fall, in dem physische SIMs vor Ort konkurrenzfähig sind."
"All three Singapore networks are excellent - the cheapest eSIM here rarely costs you coverage." = "Alle drei Netze in Singapur sind hervorragend — die günstigste eSIM kostet dich hier selten Abdeckung."
"Alpine coverage belongs to A1; Magenta-based eSIMs dip in Tyrol valleys." = "Die Alpenabdeckung gehört A1; eSIMs auf Magenta-Basis verlieren in den Tiroler Tälern."
"Andean passes drop every network - offline maps matter more than plan choice on the Salkantay route." = "Andenpässe verlieren jedes Netz — auf der Salkantay-Route zählen Offline-Karten mehr als die Tarifwahl."
"Australian 'unlimited' tourist eSIMs always carry a daily speed cap after 2-3 GB." = "Australische „Unlimited“-Touristen-eSIMs haben immer eine tägliche Geschwindigkeitsgrenze nach 2–3 GB."
