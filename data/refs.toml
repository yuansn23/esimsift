# ============================================================
# External references — 品牌×国家子页「宿主网络」区块的佐证来源
# ============================================================
# 为什么有这个文件
#   页面列出了「该国由哪些本地运营商承载、典型速度区间、覆盖强弱」这类
#   判断。列出判断却不给核实入口 = 读者只能选择相信或不相信。
#   本文件给两类来源，模板渲染成可点开的外链。
#
# 两类来源，含义不同，不要混用
#   [sources]  独立**第三方**：测速/监管机构对整国的测量口径。
#              当前统一用 Ookla Speedtest Global Index 的该国页
#              （`/global-index/<slug>`，slug 取自 data/countries.toml，
#              实测：真 slug -> 200 且页面含国名；假 slug -> 404）。
#   [carriers] 运营商**官方**站点 / 覆盖地图（一手来源）。
#              国名按 data/carriers.toml 的 ISO 键，运营商名必须与其
#              profiles[].name 逐字一致（含空格、大小写、U+002B）。
#
# 硬性规则
#   1. 每条 URL 必须被 scripts/verify_external_refs.py 验证为 HTTP 2xx
#      才允许留在这里。验证不过的一律删除 —— 宁可少一条链接，不留死链。
#   2. 不做猜测性填写。不确定的运营商域名不要写，模板会自动跳过。
#   3. 运营商名与 ISO 的组合必须能在 carriers.toml 里找到，否则是孤儿条目。
#   4. 复核节奏：随页面「Last checked」一起，手工跑验证脚本。
#      （网络检查不进 npm run build —— 离线构建必须仍然能过。）
# ============================================================

# ── 关于「每国第三方来源」────────────────────────────────────
# 本文件刻意**不**收录 Ookla Global Index 的国家链接。那套 slug 规则
# （data/networkreports.toml 的 ookla_slug 覆盖 countries.toml 的 slug）
# 已由 compare/single.html 与 compare/provider.html 共用 —— 同一事实写在三处，
# 就是三处都会错。实测 `macao` 与 `turkiye` 正是死链，只有例外表里记着
# 正确写法（`macau`、`t%C3%BCrkiye`），所以例外必须只有一份。
# ────────────────────────────────────────────────────────────

