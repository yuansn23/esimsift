[[faq]]
q = "Is unlimited eSIM data in Spain actually unlimited?"
a = "Not quite - all {unl_count} 'unlimited' {country} plans carry a fair-use policy. The spread is wide - {unl_perday_range} a day - and {unl_brand} sits at the bottom of it at ${unl_perday}/day over {unl_days} days. Two figures decide whether a capped plan suits you, and {unl_brand} publishes both: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Spain?"
a = "They sell different things, so the answer depends on how you use data. On Airalo's side the best value is ${ah_airalo_pergb}/GB - {ah_airalo_plan} at ${ah_airalo_price} - priced per gigabyte rather than per day. Holafly only sells unlimited by the day: {ah_holafly_days} days for ${ah_holafly_price}, or ${ah_holafly_perday} a day."

[[faq]]
q = "Do I need ID verification for a Spain eSIM?"
a = "No. Spain does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Spain eSIMs use?"
a = "Plans on this page run on Movistar, Vodafone, Orange, Yoigo. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Spain and France?"
a = "Not with a single-country plan. Everything in our {country} tables is scoped to {country} alone, so a trip that also takes in {neighbor} needs either a second country plan or a regional bundle."
