[[faq]]
q = "What is the cheapest eSIM for India?"
a = "Cheapest plan for {country}: {cheap_brand}'s {cheap_plan}, ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Match the plan to your trip length rather than chasing the single lowest number."

[[faq]]
q = "Is unlimited eSIM data in India actually unlimited?"
a = "Only within limits. The {unl_count} unlimited {country} plans slow to a published speed after a set allowance each day. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. What {unl_brand} publishes: {unl_allowance}; after that, {unl_drop}."

[[faq]]
q = "Airalo or Holafly for India?"
a = "Pick by usage pattern, because the two brands do not price the same way at all. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly sells unlimited days instead, its smallest {country} package being {ah_holafly_days} days for ${ah_holafly_price} (${ah_holafly_perday}/day)."

[[faq]]
q = "Do I need ID verification for an eSIM in India?"
a = "Yes. Indian rules tie registration to a passport even for travel eSIMs, and the providers we track finish that verification in-app in about two minutes. Complete it on home Wi-Fi: the check is quick, but doing it after landing costs you the first hour of the trip."

[[faq]]
q = "Which networks do India eSIMs use?"
a = "Plans on this page run on Jio, Airtel. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover India and Thailand?"
a = "Yes, but only through a multi-country plan, because nothing in our {country} tables covers a second country. Look for a regional package that includes {neighbor} and compare its $/GB with two single-country plans."

[[faq]]
q = "Can I use an eSIM in India?"
a = "{plan_count} plans across {brand_count} providers are listed for {country} on this page, and every one of them is usable. Of the {plan_count} {country} plans listed here, none is limited to a particular region of the country. Check your handset first, then pick the plan that matches your trip length."

[[faq]]
q = "Will my phone work with an eSIM in India?"
a = "An eSIM-capable unlocked phone works in {country} without any extra step. The eSIM chip is fixed at manufacture, so a handset built without one cannot gain it later, however many {country} plans we list. Run the *#06# test before you buy a plan."

[[faq]]
q = "Do I need a local number in India?"
a = "Only if local calls matter to you, because the {plan_count} plans listed for {country} are data products. Where voice exists it is app-based rather than a real local number, which is what most travellers actually need. Keep your home SIM active for calls and codes, and let the eSIM carry data."

[[faq]]
q = "What do travellers say about eSIMs in India?"
a = "The reviews themselves live on the providers' own sites and app stores. A five-star average and a one-star average usually describe different trips rather than different products. Read the numbers above first, then check the provider's own reviews for the human side."
