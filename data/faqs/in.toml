[[faq]]
q = "What is the cheapest eSIM for India?"
a = "Cheapest plan for {country}: {cheap_brand}'s {cheap_plan}, ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Match the plan to your trip length rather than chasing the single lowest number."

[[faq]]
q = "Is unlimited eSIM data in India actually unlimited?"
a = "Only within limits. The {unl_count} unlimited {country} plans slow to a published speed after a set allowance each day. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. What {unl_brand} publishes: {unl_allowance}; after that, {unl_drop}."

[[faq]]
q = "Airalo or Holafly for India?"
a = "Pick by usage pattern, because the two brands do not price the same way at all. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly sells unlimited days instead, its smallest {country} package being {ah_holafly_days} days for ${ah_holafly_price} (${ah_holafly_perday}/day)."

[[faq]]
q = "Do I need ID verification for a India eSIM?"
a = "Yes. Local law requires passport-linked registration even for travel eSIMs, but the big providers verify in-app in a couple of minutes."

[[faq]]
q = "Which networks do India eSIMs use?"
a = "Plans on this page run on Jio, Airtel. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover India and Thailand?"
a = "Yes, but only through a multi-country plan, because nothing in our {country} tables covers a second country. Look for a regional package that includes {neighbor} and compare its $/GB with two single-country plans."
