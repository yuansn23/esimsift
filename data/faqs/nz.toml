[[faq]]
q = "Is unlimited eSIM data in New Zealand actually unlimited?"
a = "Not quite - all {unl_count} 'unlimited' {country} plans carry a fair-use policy. The best day rate belongs to {unl_brand} - ${unl_perday} for a {unl_days}-day package at ${unl_price} - and the market spans {unl_perday_range}. Throttling rather than disconnection is the trade-off, with speeds falling to {unl_drop} once the allowance is spent."

[[faq]]
q = "Airalo or Holafly for New Zealand?"
a = "They sell different things, so the answer depends on how you use data. Airalo's way into {country} is a data bucket - {ah_airalo_plan} at ${ah_airalo_price}, or ${ah_airalo_pergb}/GB at its sharpest. The flat-rate option is Holafly, at {ah_holafly_days} days from ${ah_holafly_price} - ${ah_holafly_perday}/day whatever you use."

[[faq]]
q = "Do I need ID verification for an eSIM in New Zealand?"
a = "No. New Zealand does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do New Zealand eSIMs use?"
a = "Plans on this page run on Spark, One NZ, 2degrees. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover New Zealand and Australia?"
a = "Not with a single-country plan. Everything in our {country} tables is scoped to {country} alone, so a trip that also takes in {neighbor} needs either a second country plan or a regional bundle."

[[faq]]
q = "Can I use an eSIM in New Zealand?"
a = "Yes - {country} is on the standard travel-eSIM map, with {brand_count} providers selling plans for it. Availability is already settled by the {plan_count} plans listed above, so the open questions are duration and gigabytes. Verify your phone, then let the $/GB column decide between the plans above."

[[faq]]
q = "Will my phone work with an eSIM in New Zealand?"
a = "If your phone supports eSIM and is carrier-unlocked it works in {country} - the destination has no say in it. Of the {plan_count} {country} plans on this page, none needs anything beyond a standard eSIM profile. Verify the device first, because the plans above only help if it passes."

[[faq]]
q = "Do I need a local number in New Zealand?"
a = "Not for a normal trip - a travel eSIM for {country} is a data product rather than a phone line. If a local number is genuinely required that means a local SIM purchase, and usually a registration step at a store. Only add a local SIM on top if local calls are a real requirement."

[[faq]]
q = "What do travellers say about eSIMs in New Zealand?"
a = "We do not aggregate reviews, so the honest answer here is about method rather than ratings. Where a provider publishes its own support and refund policy we link it directly, so you can read the source rather than a summary. Check the provider's fair-use and refund pages directly before you commit."
