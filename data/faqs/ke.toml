[[faq]]
q = "What is the cheapest eSIM for Kenya?"
a = "{cheap_brand}'s {cheap_plan} is the cheapest {country} plan we track, at ${cheap_price}. That works out at ${cheap_perday} a day, which suits a short stop better than a long one. Check the validity window alongside the price, because a cheap plan that expires early is not cheap."

[[faq]]
q = "Is unlimited eSIM data in Kenya actually unlimited?"
a = "Not quite - all {unl_count} 'unlimited' {country} plans carry a fair-use policy. Duration moves the rate as much as the cap does: {unl_perday_range} per day across the set, with {unl_brand} lowest at ${unl_perday} for {unl_days} days. Treat the published terms as the real limit: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Kenya?"
a = "They sell different things, so the answer depends on how you use data. For {country}, Airalo's cheapest rate per gigabyte is ${ah_airalo_pergb} ({ah_airalo_plan}, ${ah_airalo_price}). Holafly's floor price for {country} is ${ah_holafly_price} over {ah_holafly_days} days (${ah_holafly_perday}/day), with no data counter to watch."

[[faq]]
q = "Do I need ID verification for a Kenya eSIM?"
a = "Yes. Local law requires passport-linked registration even for travel eSIMs, but the big providers verify in-app in a couple of minutes."

[[faq]]
q = "Which networks do Kenya eSIMs use?"
a = "Plans on this page run on Safaricom, Airtel Kenya, Telkom Kenya. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

