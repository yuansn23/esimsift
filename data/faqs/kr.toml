# South Korea FAQ - generated (review before launch)

[[faq]]
q = "What is the cheapest eSIM for South Korea?"
a = "Roami - the 1GB / 7 Days at $2.99 ($0.43/day) is the cheapest plan we track. That buys 1GB over 7 days: enough for maps and messaging if your hotel has Wi-Fi."

[[faq]]
q = "Is unlimited eSIM data in South Korea actually unlimited?"
a = "Not quite. All 10 'unlimited' plans here apply fair-use policies - the cheapest, Roami at $19.99 ($2.86/day), carries: Soft cap 2GB/day at full speed, then throttled. Treat them as big-but-capped plans and compare the caps."

[[faq]]
q = "Airalo or Holafly for South Korea?"
a = "Different animals. Airalo sells metered buckets - its best rate here is competitive per GB - while Holafly only sells unlimited-by-day ($3.92/day at its cheapest tier). Short light trip: Airalo-style buckets win. Heavy data or hotspot sharing: Holafly's flat rate caps your downside."

[[faq]]
q = "Do I need ID verification for a South Korea eSIM?"
a = "No. South Korea does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do South Korea eSIMs use?"
a = "Plans on this page run on SK Telecom, KT, LG U+. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover South Korea and Japan?"
a = "Regional Asia/continental plans from Airalo and Nomad bundle South Korea with neighbors - usually worse $/GB than single-country plans, but cheaper than two separate eSIMs. For a two-country trip, compare one regional plan against two country-specific ones in the tables before buying."
