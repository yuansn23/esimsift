[[faq]]
q = "What is the cheapest eSIM for Netherlands?"
a = "At ${cheap_price}, {cheap_brand}'s {cheap_plan} is the cheapest way online in {country}. That works out at ${cheap_perday} a day, which suits a short stop better than a long one. If you only need maps and messaging the entry price is enough, and anyone streaming should shop on $/GB."

[[faq]]
q = "Is unlimited eSIM data in Netherlands actually unlimited?"
a = "Treat them as capped: {unl_count} unlimited {country} plans each state a daily allowance and a fallback speed. Duration moves the rate as much as the cap does: {unl_perday_range} per day across the set, with {unl_brand} lowest at ${unl_perday} for {unl_days} days. Check the fallback speed before you commit, because that is what you get after the daily allowance: {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Netherlands?"
a = "The honest answer is that these two are not interchangeable. For {country}, Airalo's cheapest rate per gigabyte is ${ah_airalo_pergb} ({ah_airalo_plan}, ${ah_airalo_price}). Take Holafly if you would rather not count gigabytes, since its {country} packages start at ${ah_holafly_price} for {ah_holafly_days} days (${ah_holafly_perday}/day), and take Airalo for a light, short trip."

[[faq]]
q = "Do I need ID verification for a Netherlands eSIM?"
a = "No. Netherlands does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Netherlands eSIMs use?"
a = "Plans on this page run on KPN, Vodafone, Odido. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Netherlands and Germany?"
a = "Only via a regional plan, because the {country} tables here are scoped to one market. Crossing into {neighbor} means either a regional package or a second plan, and the per-gigabyte rate is what tells them apart."
