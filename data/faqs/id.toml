# Indonesia FAQ - generated (review before launch)
# 三条含数字的答案（最便宜 / unlimited 计数 / Airalo-Holafly）用 {token} 占位；值由 layouts/partials/faq-live-tokens.html 构建期现算 —— 不要手改回真实数字：会与正上方价格表打架，且 scripts/check_faq_facts.py 会失败。

[[faq]]
q = "What is the cheapest eSIM for Indonesia?"
a = "On entry price, {cheap_brand} leads {country} with {cheap_plan} at ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Check the validity window alongside the price, because a cheap plan that expires early is not cheap."

[[faq]]
q = "Is unlimited eSIM data in Indonesia actually unlimited?"
a = "No. Each of the {unl_count} unlimited {country} plans caps its daily full-speed allowance. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. Treat the published terms as the real limit: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Indonesia?"
a = "Different products: Airalo sells fixed data buckets, Holafly sells unlimited days. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly's floor price for {country} is ${ah_holafly_price} over {ah_holafly_days} days (${ah_holafly_perday}/day), with no data counter to watch."

[[faq]]
q = "Do I need ID verification for an eSIM in Indonesia?"
a = "Yes - Indonesian law requires a passport upload when an eSIM is registered, and the providers collect it during purchase. Getting that out of the way before you fly is worth it here, because the archipelago spreads its good signal unevenly: Telkomsel holds up outside Java and Bali where cheaper Indosat-based plans do not."

[[faq]]
q = "Which networks do Indonesia eSIMs use?"
a = "Plans on this page run on Telkomsel, Indosat, XL Axiata. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Indonesia and Singapore?"
a = "Only with a regional package, because the country plans on this page do not cross borders. The markets around {country} all have their own tables here - {neighbors_all} among them - so price a regional bundle against two single-country plans."

[[faq]]
q = "Can I use an eSIM in Indonesia?"
a = "An eSIM works in {country}, and nothing about the destination blocks it. Of the {plan_count} {country} plans listed here, none is limited to a particular region of the country. The device check takes thirty seconds, and the plans above are all priced on one scale."

[[faq]]
q = "Will my phone work with an eSIM in Indonesia?"
a = "Your handset is the deciding factor here, not {country}. The eSIM chip is fixed at manufacture, so a handset built without one cannot gain it later, however many {country} plans we list. Confirm the EID appears, then compare the plans above."

[[faq]]
q = "Do I need a local number in Indonesia?"
a = "A local number is not required to use an eSIM in {country}. Where voice exists it is app-based rather than a real local number, which is what most travellers actually need. Use the eSIM for data and the home line for anything that needs the number."

[[faq]]
q = "What do travellers say about eSIMs in Indonesia?"
a = "Review scores are the one thing we deliberately leave out, because a single number hides the variation behind it. A five-star average and a one-star average usually describe different trips rather than different products. The measured comparison is above, and the opinions are best read where they were posted."
