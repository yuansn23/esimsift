[[faq]]
q = "What is the cheapest eSIM for Indonesia?"
a = "On entry price, {cheap_brand} leads {country} with {cheap_plan} at ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Check the validity window alongside the price, because a cheap plan that expires early is not cheap."

[[faq]]
q = "Is unlimited eSIM data in Indonesia actually unlimited?"
a = "No. Each of the {unl_count} unlimited {country} plans caps its daily full-speed allowance. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. Treat the published terms as the real limit: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Indonesia?"
a = "Different products: Airalo sells fixed data buckets, Holafly sells unlimited days. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly's floor price for {country} is ${ah_holafly_price} over {ah_holafly_days} days (${ah_holafly_perday}/day), with no data counter to watch."

[[faq]]
q = "Do I need ID verification for a Indonesia eSIM?"
a = "Yes. Local law requires passport-linked registration even for travel eSIMs, but the big providers verify in-app in a couple of minutes."

[[faq]]
q = "Which networks do Indonesia eSIMs use?"
a = "Plans on this page run on Telkomsel, Indosat, XL Axiata. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Indonesia and Singapore?"
a = "Only with a regional package, because the country plans on this page do not cross borders. The markets around {country} all have their own tables here - {neighbors_all} among them - so price a regional bundle against two single-country plans."
