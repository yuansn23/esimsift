# Iceland FAQ - generated (review before launch)
# 三条含数字的答案（最便宜 / unlimited 计数 / Airalo-Holafly）用 {token} 占位；值由 layouts/partials/faq-live-tokens.html 构建期现算 —— 不要手改回真实数字：会与正上方价格表打架，且 scripts/check_faq_facts.py 会失败。

[[faq]]
q = "What is the cheapest eSIM for Iceland?"
a = "Start with {cheap_brand}, whose {cheap_plan} is the cheapest {country} plan at ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Decide your days and your rough gigabytes first, then pick the plan that fits both."

[[faq]]
q = "Is unlimited eSIM data in Iceland actually unlimited?"
a = "'Unlimited' here means unlimited data, not unlimited speed: {unl_count} {country} plans apply fair-use caps. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. The part people miss is what happens after the cap: {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Iceland?"
a = "Airalo and Holafly solve different problems, so compare the models before the prices. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly's model is daily unlimited, starting at {ah_holafly_days} days for ${ah_holafly_price} - ${ah_holafly_perday}/day - so heavy use costs the same as light use."

[[faq]]
q = "Do I need ID verification for an eSIM in Iceland?"
a = "No. Iceland does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Iceland eSIMs use?"
a = "Plans on this page run on Siminn, Vodafone, Noa. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
# Q6：国家没有 countries.toml `neighbors`（无邻国 7 国之一），所以问题点名 **region** 而不是邻国 ——
# 否则只剩「Can one eSIM cover Iceland?」这种同义反复的问法（2026-10-07 第四十二轮修）。
q = "Can one eSIM cover Iceland and the rest of Europe?"
a = "Not on a single-country plan. If the itinerary continues from {country} into {neighbor}, compare a regional package with two separate plans, since the tables here price each market on its own."

[[faq]]
q = "Can I use an eSIM in Iceland?"
a = "Travel eSIMs are sold for {country} by every provider we track, and none of them needs a local address. Of the {plan_count} {country} plans listed here, none is limited to a particular region of the country. Run the compatibility check, then compare the plans above on $/GB and $/day."

[[faq]]
q = "Will my phone work with an eSIM in Iceland?"
a = "Compatibility is entirely about your device, and {country} adds no requirement of its own. The eSIM chip is fixed at manufacture, so a handset built without one cannot gain it later, however many {country} plans we list. Check for an EID number and a no-restrictions carrier lock first."

[[faq]]
q = "Do I need a local number in Iceland?"
a = "Not for a visitor. A {country} eSIM gives you connectivity, and the number stays with your home line. Where voice exists it is app-based rather than a real local number, which is what most travellers actually need. Plan on data from the eSIM and your existing number from the home line."

[[faq]]
q = "What do travellers say about eSIMs in Iceland?"
a = "No aggregate score from us. What this page offers instead is the arithmetic. A five-star average and a one-star average usually describe different trips rather than different products. Use the tables above for the facts and the provider's own channels for sentiment."
