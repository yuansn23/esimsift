[[faq]]
q = "What is the cheapest eSIM for Croatia?"
a = "{cheap_brand}'s {cheap_plan} is the cheapest {country} plan we track, at ${cheap_price}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. If you only need maps and messaging the entry price is enough, and anyone streaming should shop on $/GB."

[[faq]]
q = "Is unlimited eSIM data in Croatia actually unlimited?"
a = "Not quite - all {unl_count} 'unlimited' {country} plans carry a fair-use policy. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. Check the fallback speed before you commit, because that is what you get after the daily allowance: {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Croatia?"
a = "They sell different things, so the answer depends on how you use data. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Take Holafly if you would rather not count gigabytes, since its {country} packages start at ${ah_holafly_price} for {ah_holafly_days} days (${ah_holafly_perday}/day), and take Airalo for a light, short trip."

[[faq]]
q = "Do I need ID verification for a Croatia eSIM?"
a = "No. Croatia does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Croatia eSIMs use?"
a = "Plans on this page run on Hrvatski Telekom, A1 Hrvatska. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

