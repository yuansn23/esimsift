[[faq]]
q = "What is the cheapest eSIM for China?"
a = "On entry price, {cheap_brand} leads {country} with {cheap_plan} at ${cheap_price}. Across the {plan_count} {country} plans from {brand_count} providers on this page, the best cost per gigabyte is {value_brand}'s {value_plan} at ${value_pergb}/GB. Small buckets suit city breaks, while longer stays are usually cheaper per gigabyte with a bigger plan."

[[faq]]
q = "Is unlimited eSIM data in China actually unlimited?"
a = "No. Each of the {unl_count} unlimited {country} plans caps its daily full-speed allowance. {unl_brand} offers the best daily rate at ${unl_perday} ({unl_days} days for ${unl_price}), against a market range of {unl_perday_range}. Two figures decide whether a capped plan suits you, and {unl_brand} publishes both: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for China?"
a = "Different products: Airalo sells fixed data buckets, Holafly sells unlimited days. Airalo sells buckets: its sharpest {country} rate is ${ah_airalo_pergb}/GB ({ah_airalo_plan}, ${ah_airalo_price}). Holafly only sells unlimited by the day: {ah_holafly_days} days for ${ah_holafly_price}, or ${ah_holafly_perday} a day."

[[faq]]
q = "Do I need ID verification for a China eSIM?"
a = "Yes. Local law requires passport-linked registration even for travel eSIMs, but the big providers verify in-app in a couple of minutes."

[[faq]]
q = "Which networks do China eSIMs use?"
a = "Plans on this page run on China Mobile, China Unicom, China Telecom. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover China and Japan?"
a = "Only with a regional package, because the country plans on this page do not cross borders. The markets around {country} all have their own tables here - {neighbors_all} among them - so price a regional bundle against two single-country plans."
