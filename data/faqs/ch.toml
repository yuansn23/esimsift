[[faq]]
q = "Is unlimited eSIM data in Switzerland actually unlimited?"
a = "Not quite - all {unl_count} 'unlimited' {country} plans carry a fair-use policy. {unl_brand} offers the best daily rate at ${unl_perday} ({unl_days} days for ${unl_price}), against a market range of {unl_perday_range}. The part people miss is what happens after the cap: {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Switzerland?"
a = "They sell different things, so the answer depends on how you use data. Airalo sells buckets: its sharpest {country} rate is ${ah_airalo_pergb}/GB ({ah_airalo_plan}, ${ah_airalo_price}). Holafly's model is daily unlimited, starting at {ah_holafly_days} days for ${ah_holafly_price} - ${ah_holafly_perday}/day - so heavy use costs the same as light use."

[[faq]]
q = "Do I need ID verification for a Switzerland eSIM?"
a = "No. Switzerland does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Switzerland eSIMs use?"
a = "Plans on this page run on Swisscom, Sunrise, Salt. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Switzerland and France?"
a = "Not with a single-country plan. Everything in our {country} tables is scoped to {country} alone, so a trip that also takes in {neighbor} needs either a second country plan or a regional bundle."
