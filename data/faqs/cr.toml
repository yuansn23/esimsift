q = "Can one eSIM cover Costa Rica and the rest of the Americas?"
a = "Not with a single-country plan. Everything in our {country} tables is scoped to {country} alone, so a trip that also takes in {neighbor} needs either a second country plan or a regional bundle."

[[faq]]
q = "Can I use an eSIM in Costa Rica?"
a = "Yes, and {country} is unremarkable in that respect - no local registration or permission is required. The choice here is about price and allowance rather than availability: {plan_count} plans from {brand_count} providers. The device check takes thirty seconds, and the plans above are all priced on one scale."

[[faq]]
q = "Will my phone work with an eSIM in Costa Rica?"
a = "Same test as anywhere: dial *#06# and look for an EID number. The two checks that matter are hardware and lock status - the {plan_count} plans here install on a phone that passes both, and fail on one that does not. Confirm the EID appears, then compare the plans above."

[[faq]]
q = "Do I need a local number in Costa Rica?"
a = "For messaging and maps you do not need one. Keeping the home line in the physical slot is the usual arrangement, and it is what lets verification texts keep arriving. Use the eSIM for data and the home line for anything that needs the number."

[[faq]]
q = "What do travellers say about eSIMs in Costa Rica?"
a = "We keep no rating for {country} eSIMs, and that is a decision rather than an omission. Fair-use terms, hotspot rules and refund windows are where the real differences hide, and those are documented rather than voted on. The measured comparison is above, and the opinions are best read where they were posted."
