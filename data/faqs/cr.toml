[[faq]]
q = "What is the cheapest eSIM for Costa Rica?"
a = "{cheap_brand} holds the headline number for {country}: {cheap_plan} at ${cheap_price}. Across the {plan_count} {country} plans from {brand_count} providers on this page, the best cost per gigabyte is {value_brand}'s {value_plan} at ${value_pergb}/GB. Check the validity window alongside the price, because a cheap plan that expires early is not cheap."

[[faq]]
q = "Is unlimited eSIM data in Costa Rica actually unlimited?"
a = "Capped, not unlimited - the {unl_count} unlimited plans for {country} throttle once the daily allowance is spent. {unl_brand} offers the best daily rate at ${unl_perday} ({unl_days} days for ${unl_price}), against a market range of {unl_perday_range}. Treat the published terms as the real limit: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Costa Rica?"
a = "It comes down to shape - buckets of data against unlimited days. Airalo sells buckets: its sharpest {country} rate is ${ah_airalo_pergb}/GB ({ah_airalo_plan}, ${ah_airalo_price}). Holafly's floor price for {country} is ${ah_holafly_price} over {ah_holafly_days} days (${ah_holafly_perday}/day), with no data counter to watch."

[[faq]]
q = "Do I need ID verification for a Costa Rica eSIM?"
a = "No. Costa Rica does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Costa Rica eSIMs use?"
a = "Plans on this page run on Kolbi, Claro, Movistar. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

