q = "Which networks do Portugal eSIMs use?"
a = "Plans on this page run on MEO, NOS, Vodafone. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Portugal and Spain?"
a = "Yes, but only through a multi-country plan, because nothing in our {country} tables covers a second country. Look for a regional package that includes {neighbor} and compare its $/GB with two single-country plans."

[[faq]]
