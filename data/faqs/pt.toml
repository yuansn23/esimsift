[[faq]]
q = "Will my phone work with an eSIM in Portugal?"
a = "An eSIM-capable unlocked phone works in {country} without any extra step. Of the {plan_count} {country} plans on this page, none needs anything beyond a standard eSIM profile. Settle both checks at home on Wi-Fi rather than at the airport."

[[faq]]
q = "Do I need a local number in Portugal?"
a = "Only if local calls matter to you, because the {plan_count} plans listed for {country} are data products. If a local number is genuinely required that means a local SIM purchase, and usually a registration step at a store. Decide whether you truly need a local number before adding a second purchase."

[[faq]]
q = "What do travellers say about eSIMs in Portugal?"
