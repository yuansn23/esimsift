# USA FAQ - generated (review before launch)

[[faq]]
q = "What is the cheapest eSIM for the USA?"
a = "Roami - the 1GB / 7 Days at $2.99 ($0.43/day) is the cheapest plan we track. That buys 1GB over 7 days: enough for maps and messaging if your hotel has Wi-Fi."

[[faq]]
q = "Is unlimited eSIM data in the USA actually unlimited?"
a = "Not quite. All 10 'unlimited' plans here apply fair-use policies - the cheapest, Holafly at $22.99 ($4.60/day), carries: 1.5GB/day high-speed cap, then 3G speeds. Treat them as big-but-capped plans and compare the caps."

[[faq]]
q = "Airalo or Holafly for the USA?"
a = "Different animals. Airalo sells metered buckets - its best rate here is competitive per GB - while Holafly only sells unlimited-by-day ($4.37/day at its cheapest tier). Short light trip: Airalo-style buckets win. Heavy data or hotspot sharing: Holafly's flat rate caps your downside."

[[faq]]
q = "Do I need ID verification for a USA eSIM?"
a = "No. The USA does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do USA eSIMs use?"
a = "Plans on this page run on T-Mobile, AT&T, Verizon. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover the USA and Canada?"
a = "Regional Asia/continental plans from Airalo and Nomad bundle the USA with neighbors - usually worse $/GB than single-country plans, but cheaper than two separate eSIMs. For a two-country trip, compare one regional plan against two country-specific ones in the tables before buying."
