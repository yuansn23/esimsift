[[faq]]
q = "What is the cheapest eSIM for the USA?"
a = "Cheapest plan for {country}: {cheap_brand}'s {cheap_plan}, ${cheap_price}. {runner_brand} sits next at ${runner_price}, and the strongest per-gigabyte rate comes from {value_brand}'s {value_plan} at ${value_pergb}/GB. If you only need maps and messaging the entry price is enough, and anyone streaming should shop on $/GB."

[[faq]]
q = "Is unlimited eSIM data in the USA actually unlimited?"
a = "Only within limits. The {unl_count} unlimited {country} plans slow to a published speed after a set allowance each day. Prices run {unl_perday_range} per day depending on duration, and {unl_brand} is the cheapest at ${unl_perday}/day. Check the fallback speed before you commit, because that is what you get after the daily allowance: {unl_drop}."

[[faq]]
q = "Airalo or Holafly for the USA?"
a = "Pick by usage pattern, because the two brands do not price the same way at all. Airalo's strongest {country} offer is ${ah_airalo_pergb}/GB, sold as {ah_airalo_plan} for ${ah_airalo_price}. Take Holafly if you would rather not count gigabytes, since its {country} packages start at ${ah_holafly_price} for {ah_holafly_days} days (${ah_holafly_perday}/day), and take Airalo for a light, short trip."

[[faq]]
q = "Do I need ID verification for a USA eSIM?"
a = "No. The USA does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do USA eSIMs use?"
a = "Plans on this page run on T-Mobile, AT&T, Verizon. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover the USA and Canada?"
a = "Yes, but only through a multi-country plan, because nothing in our {country} tables covers a second country. Look for a regional package that includes {neighbor} and compare its $/GB with two single-country plans."
