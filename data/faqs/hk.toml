[[faq]]
q = "Do I need ID verification for a Hong Kong eSIM?"
a = "No. Hong Kong does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Hong Kong eSIMs use?"
a = "Plans on this page run on CSL, 3HK, SmarTone. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Hong Kong and Taiwan?"
a = "Only via a regional plan, because the {country} tables here are scoped to one market. Crossing into {neighbor} means either a regional package or a second plan, and the per-gigabyte rate is what tells them apart."
