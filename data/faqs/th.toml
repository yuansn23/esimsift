[[faq]]
q = "What is the cheapest eSIM for Thailand?"
a = "On entry price, {cheap_brand} leads {country} with {cheap_plan} at ${cheap_price}. {runner_brand} sits next at ${runner_price}, and the strongest per-gigabyte rate comes from {value_brand}'s {value_plan} at ${value_pergb}/GB. Match the plan to your trip length rather than chasing the single lowest number."

[[faq]]
q = "Is unlimited eSIM data in Thailand actually unlimited?"
a = "No. Each of the {unl_count} unlimited {country} plans caps its daily full-speed allowance. Prices run {unl_perday_range} per day depending on duration, and {unl_brand} is the cheapest at ${unl_perday}/day. What {unl_brand} publishes: {unl_allowance}; after that, {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Thailand?"
a = "Different products: Airalo sells fixed data buckets, Holafly sells unlimited days. Airalo's strongest {country} offer is ${ah_airalo_pergb}/GB, sold as {ah_airalo_plan} for ${ah_airalo_price}. Holafly sells unlimited days instead, its smallest {country} package being {ah_holafly_days} days for ${ah_holafly_price} (${ah_holafly_perday}/day)."

[[faq]]
q = "Do I need ID verification for a Thailand eSIM?"
a = "No. Thailand does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Thailand eSIMs use?"
a = "Plans on this page run on AIS, True Move, DTAC. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Thailand and Malaysia?"
a = "Only with a regional package, because the country plans on this page do not cross borders. The markets around {country} all have their own tables here - {neighbors_all} among them - so price a regional bundle against two single-country plans."
