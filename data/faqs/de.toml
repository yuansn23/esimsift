# Germany FAQ - generated (review before launch)

[[faq]]
q = "What is the cheapest eSIM for Germany?"
a = "Roami - the 1GB / 7 Days at $2.99 ($0.43/day) is the cheapest plan we track. That buys 1GB over 7 days: enough for maps and messaging if your hotel has Wi-Fi."

[[faq]]
q = "Is unlimited eSIM data in Germany actually unlimited?"
a = "Not quite. All 10 'unlimited' plans here apply fair-use policies - the cheapest, Roami at $20.99 ($3.00/day), carries: Soft cap 2GB/day at full speed, then throttled. Treat them as big-but-capped plans and compare the caps."

[[faq]]
q = "Airalo or Holafly for Germany?"
a = "Different animals. Airalo sells metered buckets - its best rate here is competitive per GB - while Holafly only sells unlimited-by-day ($4.03/day at its cheapest tier). Short light trip: Airalo-style buckets win. Heavy data or hotspot sharing: Holafly's flat rate caps your downside."

[[faq]]
q = "Do I need ID verification for a Germany eSIM?"
a = "No. Germany does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Germany eSIMs use?"
a = "Plans on this page run on Telekom, Vodafone, O2. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Germany and France?"
a = "Regional Asia/continental plans from Airalo and Nomad bundle Germany with neighbors - usually worse $/GB than single-country plans, but cheaper than two separate eSIMs. For a two-country trip, compare one regional plan against two country-specific ones in the tables before buying."
