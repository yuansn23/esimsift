[[faq]]
q = "Airalo or Holafly for Turkiye?"
a = "Neither is the cheapest plan on this page, and the two are not competing on the same terms either. Airalo's strongest {country} offer is ${ah_airalo_pergb}/GB, sold as {ah_airalo_plan} for ${ah_airalo_price}. Holafly's model is daily unlimited, starting at {ah_holafly_days} days for ${ah_holafly_price} - ${ah_holafly_perday}/day - so heavy use costs the same as light use."

[[faq]]
q = "Do I need ID verification for a Turkiye eSIM?"
a = "Yes. Local law requires passport-linked registration even for travel eSIMs, but the big providers verify in-app in a couple of minutes."

[[faq]]
q = "Which networks do Turkiye eSIMs use?"
a = "Plans on this page run on Turkcell, Vodafone, Turk Telekom. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Turkiye and Greece?"
a = "Not with a country plan alone, because {country} plans stop at the border. Adding {neighbor} means a regional bundle or a second plan, and the two-country arithmetic is worth doing before you buy."
