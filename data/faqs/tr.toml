[[faq]]
q = "Do I need ID verification for an eSIM in Turkiye?"
a = "Yes - Turkish SIM rules tie registration to a passport, and the sellers we track collect the details during checkout instead of over a counter. That is the practical difference from a Turkcell tourist package: no airport desk, no queue, and the profile is already on your phone when you land."

[[faq]]
q = "Which networks do Turkiye eSIMs use?"
