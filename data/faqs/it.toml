[[faq]]
q = "What is the cheapest eSIM for Italy?"
a = "At ${cheap_price}, {cheap_brand}'s {cheap_plan} is the cheapest way online in {country}. Price and value are different measurements, and on cost per gigabyte the winner is {value_brand}'s {value_plan} at ${value_pergb}/GB. Small buckets suit city breaks, while longer stays are usually cheaper per gigabyte with a bigger plan."

[[faq]]
q = "Is unlimited eSIM data in Italy actually unlimited?"
a = "Treat them as capped: {unl_count} unlimited {country} plans each state a daily allowance and a fallback speed. {unl_brand} comes out cheapest per day at ${unl_perday}, and the full band here spans {unl_perday_range}. Two figures decide whether a capped plan suits you, and {unl_brand} publishes both: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Italy?"
a = "The honest answer is that these two are not interchangeable. Airalo's {ah_airalo_plan} works out at ${ah_airalo_pergb}/GB for ${ah_airalo_price}, and what you buy is what you get. Holafly only sells unlimited by the day: {ah_holafly_days} days for ${ah_holafly_price}, or ${ah_holafly_perday} a day."

[[faq]]
q = "Do I need ID verification for a Italy eSIM?"
a = "No. Italy does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Italy eSIMs use?"
a = "Plans on this page run on TIM, Vodafone, WindTre. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Italy and France?"
a = "Only via a regional plan, because the {country} tables here are scoped to one market. Crossing into {neighbor} means either a regional package or a second plan, and the per-gigabyte rate is what tells them apart."
