[[faq]]
q = "Will my phone work with an eSIM in Czechia?"
a = "An eSIM-capable unlocked phone works in {country} without any extra step. The two checks that matter are hardware and lock status - the {plan_count} plans here install on a phone that passes both, and fail on one that does not. Verify the device first, because the plans above only help if it passes."

[[faq]]
q = "Do I need a local number in Czechia?"
a = "Only if local calls matter to you, because the {plan_count} plans listed for {country} are data products. Keeping the home line in the physical slot is the usual arrangement, and it is what lets verification texts keep arriving. Only add a local SIM on top if local calls are a real requirement."

[[faq]]
q = "What do travellers say about eSIMs in Czechia?"
a = "The reviews themselves live on the providers' own sites and app stores. Fair-use terms, hotspot rules and refund windows are where the real differences hide, and those are documented rather than voted on. Check the provider's fair-use and refund pages directly before you commit."
