# 日本 FAQ —— 只做对比角度（激活/安装类问题归 Roami 站，防 SERP 重叠）
# 三条含数字的答案（最便宜 / unlimited 计数 / Airalo-Holafly）用 {token} 占位；值由 layouts/partials/faq-live-tokens.html 构建期现算 —— 不要手改回真实数字：会与正上方价格表打架，且 scripts/check_faq_facts.py 会失败。
# 文件名 = 小写 ISO 码，模板按 index site.Data.faqs (lower iso) 取

[[faq]]
q = "Which is the cheapest eSIM for Japan?"
a = "Among major providers, {cheap_brand} currently has the lowest entry price for {country} at ${cheap_price} for its {cheap_plan} package, and {runner_brand} is the closest challenger at ${runner_price}. If you only need maps and messaging, either plan covers a short city break - but on a per-GB basis {value_brand}'s {value_plan} is the strongest value we track at ${value_pergb}/GB."

[[faq]]
q = "Is unlimited data eSIM in Japan really unlimited?"
a = "Only within limits. Every one of the {unl_count} unlimited plans we track for {country} caps the full-speed allowance for each day and then throttles, and the day rate across them runs from {unl_perday_range}. The cheapest by day rate is {unl_brand} at ${unl_price} for {unl_days} days (${unl_perday}/day); its published terms: allowance {unl_allowance}; after that, {unl_drop}. Read the per-day price and the fair-use cap together before you buy."

[[faq]]
q = "Is Airalo or Holafly better for Japan?"
a = "Different products, so it depends on how you use data. Airalo sells fixed buckets - its best {country} rate is ${ah_airalo_pergb}/GB ({ah_airalo_plan} at ${ah_airalo_price}) - which suits light use and sidesteps fair-use ambiguity entirely. Holafly sells unlimited data by the day only, from ${ah_holafly_price} for {ah_holafly_days} days (${ah_holafly_perday}/day), which suits heavy streamers who would rather not count gigabytes. For the same data neither is the cheapest on this page: {cheap_brand} leads at ${cheap_price}."

[[faq]]
q = "Do I need a passport or ID to use an eSIM in Japan?"
a = "No - not with travel eSIMs. Japanese law requires passport verification for local prepaid SIM cards from SoftBank, NTT Docomo and KDDI, but travel eSIMs bypass this registration entirely. Every brand we track for Japan sells without a document upload at any step: buy, scan the QR code, and connect."

[[faq]]
q = "Which Japanese network does each provider use?"
a = "All of them. Every provider we track - {brands_list} - connects to the same three national networks in Japan (NTT Docomo, SoftBank and KDDI), so the brand on the voucher does not decide your coverage. What differs between providers is price per GB, plan shapes, hotspot rules and support. Docomo has the widest rural reach of the three, which matters on mountain routes and island hops, but because every Japan plan we list falls back across all three networks your phone picks the strongest signal available rather than staying pinned to one mast."

[[faq]]
q = "Can one eSIM cover Japan and South Korea on the same trip?"
a = "Yes - several providers sell Asia regional plans that bundle Japan with Korea, Taiwan and Hong Kong. If you are visiting two or more countries, a regional plan usually beats buying separate country eSIMs. Check our regional comparison before buying two single-country plans."

[[faq]]
q = "Can I use an eSIM in Japan?"
a = "An eSIM works in Japan the same way it works anywhere else: the profile registers on a Japanese network when you land, and nothing about the country blocks it. All {brand_count} providers we track sell Japan plans, and the {plan_count} packages listed above connect to the same three national networks. What decides success is your handset rather than the destination."

[[faq]]
q = "Will my phone work with an eSIM in Japan?"
a = "Japan adds no handset requirement of its own, so any eSIM-capable and carrier-unlocked phone works with the plans on this page. The trap is the phone rather than the country: the same model name can ship with or without an eSIM chip depending on the market it was sold in, and a handset bought in mainland China has no chip at all. Dial *#06# before you buy, and a Japan plan will install if an EID number appears."

[[faq]]
q = "Do I need a local number in Japan?"
a = "A Japanese phone number is not required for a travel eSIM, and the plans on this page are data-only. Local voice SIMs in Japan come with identity checks that travel eSIMs skip entirely, which is why the number people reach you on stays your own. Keep the physical SIM active for calls and verification codes, and let the eSIM carry data."

[[faq]]
q = "What do travellers say about eSIMs in Japan?"
a = "Rather than a star rating, this page answers the review question with measurements - the {plan_count} Japan plans from {brand_count} providers, ranked on one $/GB and $/day formula. Review scores for the same brand differ by the region the reviewer sits in, so a single figure would mislead. Read the numbers above for the verifiable half, and the provider's own channels for sentiment."
