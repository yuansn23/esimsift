# 日本 FAQ —— 只做对比角度（激活/安装类问题归 Roami 站，防 SERP 重叠）
# 文件名 = 小写 ISO 码，模板按 index site.Data.faqs (lower iso) 取

[[faq]]
q = "Which is the cheapest eSIM for Japan?"
a = "Among major providers, Roami currently has the lowest entry price for Japan at $1.99 for 1GB over 7 days, and its 3GB/7-day plan at $3.99 undercuts every competitor's budget tier. Saily is the closest challenger at $3.99 for 1GB. If you only need maps and messaging, either plan covers a short city break - but on a per-GB basis Roami's larger bundles are the strongest value in the market."

[[faq]]
q = "Is unlimited data eSIM in Japan really unlimited?"
a = "Only within limits. Every unlimited plan we track for Japan caps the full-speed allowance for each day and then throttles - most list 3 GB or 5 GB per day before the fallback, and the fallback speed is listed differently by each provider rather than by any market standard. Duration moves the price as much as the policy does: Holafly's flat daily rate runs about $3.97 per day on a 3-day plan but drops to $2.46 per day over 30 days, so the same brand looks expensive for a weekend and competitive for a month. Read the per-day price and the fair-use cap together before you buy."

[[faq]]
q = "Is Airalo or Holafly better for Japan?"
a = "Different products, so it depends on how you use data. Airalo sells fixed buckets - its entry Japan plan is 1 GB for 3 days at $4.00 and a 3 GB week costs $8.00 - which suits light use and sidesteps fair-use ambiguity entirely. Holafly sells unlimited data by the day only, from $11.90 for 3 days, which suits heavy streamers who would rather not count gigabytes. Neither is the cheapest for the same data: Roami and Roamic undercut both."

[[faq]]
q = "Do I need a passport or ID to use an eSIM in Japan?"
a = "No - not with travel eSIMs. Japanese law requires passport verification for local prepaid SIM cards from SoftBank, NTT Docomo and KDDI, but travel eSIMs bypass this registration entirely. Every brand we track for Japan sells without a document upload at any step: buy, scan the QR code, and connect."

[[faq]]
q = "Which Japanese network does each provider use?"
a = "All of them. Every provider we track - Airalo, aloSIM, Holafly, Roami, Roamic, Saily, Ubigi and Yesim - connects to the same three national networks in Japan (NTT Docomo, SoftBank and KDDI), so the brand on the voucher does not decide your coverage. What differs between providers is price per GB, plan shapes, hotspot rules and support. Docomo has the widest rural reach of the three, which matters on mountain routes and island hops, but because every Japan plan we list falls back across all three networks your phone picks the strongest signal available rather than staying pinned to one mast."

[[faq]]
q = "Can one eSIM cover Japan and South Korea on the same trip?"
a = "Yes - several providers sell Asia regional plans that bundle Japan with Korea, Taiwan and Hong Kong. If you are visiting two or more countries, a regional plan usually beats buying separate country eSIMs. Check our regional comparison before buying two single-country plans."
