[[faq]]
q = "What is the cheapest eSIM for Malaysia?"
a = "Start with {cheap_brand}, whose {cheap_plan} is the cheapest {country} plan at ${cheap_price}. That works out at ${cheap_perday} a day, which suits a short stop better than a long one. Small buckets suit city breaks, while longer stays are usually cheaper per gigabyte with a bigger plan."

[[faq]]
q = "Is unlimited eSIM data in Malaysia actually unlimited?"
a = "'Unlimited' here means unlimited data, not unlimited speed: {unl_count} {country} plans apply fair-use caps. Duration moves the rate as much as the cap does: {unl_perday_range} per day across the set, with {unl_brand} lowest at ${unl_perday} for {unl_days} days. Two figures decide whether a capped plan suits you, and {unl_brand} publishes both: {unl_allowance}, then {unl_drop}."

[[faq]]
q = "Airalo or Holafly for Malaysia?"
a = "Airalo and Holafly solve different problems, so compare the models before the prices. For {country}, Airalo's cheapest rate per gigabyte is ${ah_airalo_pergb} ({ah_airalo_plan}, ${ah_airalo_price}). Holafly only sells unlimited by the day: {ah_holafly_days} days for ${ah_holafly_price}, or ${ah_holafly_perday} a day."

[[faq]]
q = "Do I need ID verification for a Malaysia eSIM?"
a = "No. Malaysia does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do Malaysia eSIMs use?"
a = "Plans on this page run on Maxis, Celcom, DiGi. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

[[faq]]
q = "Can one eSIM cover Malaysia and Thailand?"
a = "One country per plan, so a {country} eSIM stops working at the border. A regional bundle or a second plan is the way to add {neighbor}, and both are worth pricing against simply buying two."
