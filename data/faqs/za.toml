[[faq]]
q = "Do I need ID verification for an eSIM in South Africa?"
a = "No. South Africa does not force ID checks on travel eSIMs - local SIM rules differ, but the plans on this page ship pre-registered."

[[faq]]
q = "Which networks do South Africa eSIMs use?"
a = "Plans on this page run on Vodacom, MTN, Telkom. Differences matter mostly outside the big cities - the network column in the main table shows which carrier each plan rides."

