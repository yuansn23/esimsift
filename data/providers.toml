# ============================================================
# 品牌档案 —— 单一事实源（结构化事实）
# 长评测/品牌页正文放 content/en/providers/<name>.md，不放这里
# sponsored: true  → 出站链接带 rel="sponsored nofollow"
# sponsored: false → 自家品牌，follow
# color / initials → 模板层品牌单色徽标（prov-avatar），非 logo 商标
# promo_* → 折扣码模块（deals 页 / 国家页 / 品牌子页共用）
#   2026-10-01 全部换真：roami web20（官网公示·新用户 20%）/ saily VEEPEE25
#   （官方合作页 25%）/ ubigi WELCOME10（官方 FAQ 首购 10%）；
#   airalo/holafly/yesim/roamic/alosim 官方无公开码 → 无 promo_* 字段（模块自动隐藏）。
#   promo_pct 供 deals 页"折扣后实际价/翻盘分析"计算；promo_expires 官方均未标
#   过期日，统一占位 2027-12-31，上线前逐个复核。
# [brand.info] → 公司档案（HQ/法人/官网/双商店/客服/退款/目的地数），
#   2026-10-01 三路代理逐品牌在官方页面核验，来源见各品牌块内注释。
# logo：static/img/providers/<key>.png 或 .webp（prov-logo 自动探测），
#   alosim/roami 暂无 logo 文件 → monogram 占位。
# logo 占位符方案：monogram 徽标即占位符；想换真 logo 只需把
#   static/img/providers/<key>.png 放进去，prov-logo partial 自动切换，无需改本文件
#
# 品牌集（2026-09-30 用户定稿 8 家）：airalo / holafly / saily / yesim /
#   ubigi / roamic / alosim + 自家 roami。roami ≠ roamic（两个不同品牌）。
# 套餐数据来源：esimdb.com（holafly 不在 esimdb，单独从官网抓）；
#   founded 事实来源：Yesim 官方新闻(2019 瑞士) / Transatel 官网(Ubigi 品牌
#   2017，NTT 2019 收购) / Roamic=Byte Travel(西班牙, 2021) /
#   aloSIM=AffinityClick(渥太华, 2021)
# ============================================================

[roami]
name = "Roami"
founded = 2024
tagline = "App-first travel eSIM with 24/7 activation"
type = "app"
color = "#1A7E6B"
initials = "Ro"
strengths = ["Aggressive pricing across Asia", "No ID verification for travel plans", "24/7 activation and human support", "Auto-switching across all three Japanese networks"]
weaknesses = ["Younger brand with fewer third-party reviews", "Deepest discounts concentrate on 3-30 day plans"]
sponsored = false
# 折扣码：web20（roamiapp.com 首页公开横幅，新用户专享 20% off）
promo_code = "web20"
promo_label = "20% off your first order (new users)"
promo_pct = 20
promo_expires = "2027-12-31"   # ⚠ 官网未标过期日，占位；请与用户确认
promo_verified = "2026-10-01"
promo_terms = "New users only — apply at checkout for 20% off your first order. Bonus on the official site: 100MB of free data when you download the Roami app."

# 公司档案（官方页面核验 2026-10-01：terms/privacy/contact/首页/App Store）
[roami.info]
hq = "Hong Kong"
legal = "Hong Kong LinZe Co., Limited"
website = "https://roamiapp.com"
app_android = ""   # 官网有 Play 徽章但无实际链接，Play 商店搜不到 App（截至核验日）
app_ios = "https://apps.apple.com/us/app/roami-esim-global-work-travel/id6747127122"
support = "24/7 human support (online assistance 365 days) and email"
support_email = "roamiesim@roamiapp.com"
response_time = ""   # 官方仅承诺 24/7/365 在线，无时限承诺
refund = "Roami's worry-free refund policy promises a full refund if the plan doesn't work or remains unused. The same 24/7 team handles activation, refunds and travel questions."
destinations = 200

