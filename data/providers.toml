# ============================================================
# [<provider>.policy] —— 政策事实（品牌×国家子页的「Plan reality check」数据源）
#
# 为什么单独抽出来：价格表回答「多少钱」，但用户真正踩坑的是三件标签外的事 ——
# 热点是否被限、满速能用多少 GB、能不能续充。这三件事在套餐数据里没有，
# 过去只散落在 strengths/weaknesses 的散文里，模板无法结构化渲染，
# 也无法让「无限流量」这个卖点接受检验。
#
# 字段（全部可选，模板对缺失字段降级为「尚未核实」而不是编造）：
#   hotspot           capped | allowed | none  —— 热点/共享的形态
#   hotspot_allowance 展示用额度串（如 "500 MB/day"）
#   hotspot_note      一句人话解释
#   fup_allowance     满速额度（"No GB figure published" 也是合法答案）
#   fup_drop          限速后的速度档
#   fup_note          一句人话解释
#   topup             true | false —— 用尽能否续充
#   topup_note
#   voice             data-only | app —— 有无本地号码
#
# 核实口径（2026-10-04 一次；2026-10-04 二次补齐 roami / roamic）：
# 以厂商官方「technical specs / 套餐页细则 / 官方 FAQ」为准；
# 官方未公布数字时如实写「未公布」，第三方实测数字在 note 里注明来源性质。
# roami / roamic 已按各自官网补齐（见文末两张表），八个品牌现在全覆盖。
# 政策会变，上线后每季度复核一次。
# ============================================================

[holafly.policy]
hotspot = "capped"
hotspot_allowance = "500 MB/day"
hotspot_note = "Holafly's own technical specs cap tethering at 500 MB/day on destination plans. Unlimited hotspot exists only on the separate Holafly Plans subscription, not on the travel plans below."
fup_allowance = "No GB figure published"
fup_drop = "256 Kbps - 1 Mbps"
fup_note = "Holafly publishes no daily GB threshold and says throttling is temporary, never longer than 24 hours. Independent testing in early 2026 measured the cut-off at 500 MB - 1 GB/day in most Western destinations, and host operators can also slow you after roughly 90 GB in a month."
topup = false
topup_note = "Holafly has no top-ups. If a plan runs out you buy a new eSIM rather than adding data to the existing one."
voice = "data-only"

[airalo.policy]
hotspot = "allowed"
hotspot_allowance = "No separate cap"
hotspot_note = "Tethering is allowed and counted against your plan's data allowance, with no separate hotspot limit and no cap on connected devices."
fup_allowance = "3 GB/day on unlimited plans"
fup_drop = "1 Mbps"
fup_note = "Airalo publishes one fair-use rule for all its unlimited plans: pass 3 GB in a day and speed drops to 1 Mbps for the rest of that day, resetting 24 hours after activation. Metered plans are never throttled - they simply stop when the data is gone."
topup = true
topup_note = "Top-ups are available in the Airalo app, so running low mid-trip costs a few dollars rather than a new eSIM."
voice = "data-only"

[saily.policy]
hotspot = "allowed"
hotspot_allowance = "No separate cap"
hotspot_note = "Saily advertises unrestricted hotspot sharing; tethering data is drawn from the same plan allowance as your phone."
fup_allowance = "5 GB/day on unlimited plans"
fup_drop = "1 Mbps"
fup_note = "Saily states its daily cap openly: 5 GB at full speed per 24-hour cycle, then around 1 Mbps. That is the most generous published threshold among the unlimited travel plans we track."
topup = true
topup_note = "In-app top-ups, so a shortfall is a two-tap fix."
voice = "data-only"

[ubigi.policy]
hotspot = "allowed"
hotspot_allowance = "No separate cap"
hotspot_note = "Data sharing is explicitly allowed and hotspot traffic counts against the plan's own allowance rather than a separate tethering budget."
fup_allowance = "Varies by plan - published per plan page"
fup_drop = "1 - 2 Mbps"
fup_note = "Ubigi publishes a different threshold on each unlimited plan, and the spread is large - two plans at the same price have been seen giving 15 GB total versus 5 GB/day. Read the fair-use line on the exact plan page you are buying from."
topup = true
topup_note = "Topping up is supported in the Ubigi account dashboard."
voice = "data-only"

[alosim.policy]
hotspot = "allowed"
hotspot_allowance = "From the plan allowance"
