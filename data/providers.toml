# ============================================================
# 品牌档案 —— 单一事实源（结构化事实）
# 长评测/品牌页正文放 content/en/providers/<name>.md，不放这里
# sponsored: true  → 出站链接带 rel="sponsored nofollow"
# sponsored: false → 自家品牌，follow
# color / initials → 模板层品牌单色徽标（prov-avatar），非 logo 商标
# promo_* → 折扣码模块（deals 页 / 国家页 / 品牌子页共用）
#   2026-10-04 第二轮全量核实（研究底稿 docs/promos/<brand>.json，8 品牌全有实码）：
#   roami web20（官网公示·整单 20%·零门槛，promo_rank=1 恒排第一）/ saily VEEPEE25
#   （官方合作页 saily.com/veepee 实测在线 25%）/ yesim DREWDEAL 20% / airalo
#   NEWTOAIRALO15 15%（新客）/ alosim ESIMTWEAKS 15% / ubigi PROMO15 15%（仅无限档）
#   / roamic FYESIM10 10% / holafly MYESIMNOW5 5%（官方，仅 5%）。
#   新增字段：promo_rank（deals 页排序）· promo_audience（all/new/existing）·
#   promo_scope（适用范围）· promo_min_spend（最低消费，空 = 无）·
#   promo_bestfor（决策指引一句话）· promo_alts（备用码 [{code,label,audience}]）。
#   promo_pct 供 deals 页"折扣后实际价/翻盘分析"计算；promo_expires 空 = 官方未标过期日
#   （页面显示 no expiry published，不编日期）。
# [brand.info] → 公司档案（HQ/法人/官网/双商店/客服/退款/目的地数/Trustpilot 档案），
#   trustpilot：官方档案 URL 2026-10-04 逐个核实。**只存链接不存分数** —— 分数按
#     Trustpilot 地区域名分片（Airalo 3.9/4.0/4.1 三个值），抓取被反爬墙拦截无法
#     给出可核实单值；品牌页改为「给档案链接 + 教读者怎么读」。roami 无档案，留空。
#   2026-10-01 三路代理逐品牌在官方页面核验，来源见各品牌块内注释。
# logo：static/img/providers/<key>.png 或 .webp（prov-logo.html 自动探测）。
#   ★ 生效目录是 **static/img/providers/**，不是 static/img/logo/ ——
#   后者只是素材下载区，放进去不会生效（2026-10-07 踩过）。
#   ★ 探测只认 .png / .webp；.jpg/.jpeg 一律探测不到，放之前先转格式。
#   2026-10-07 起 9 家（含 nomad）都有真 logo；monogram 徽标退为**兜底**
#   （真 logo 缺失或加载失败时才露出），谁要换 logo 只需把
#   static/img/providers/<key>.png 放进去，prov-logo 自动切换，无需改本文件。
#
# 品牌集（2026-09-30 用户定稿 8 家）：airalo / holafly / saily / yesim /
#   ubigi / roamic / alosim + 自家 roami。roami ≠ roamic（两个不同品牌）。
#   **2026-10-06 起扩到 12 家**（用户定：只做这 4 个），第二批 = nomad / gigsky /
#   jetpac / bnesim。做法是「先单品牌打通全链路、验收无误再批量」——
#   nomad 为试点（50/50 国覆盖、数据最干净），其余 3 家待 nomad 验收后接入。
#   第二批数据源：esimdb 同源抓取（scripts/scrape/raw/<brand>/）；
#   bnesim 例外，来自官网公开定价 API，且**计价货币是 EUR**，接入前必须先折 USD。
# 套餐数据来源：esimdb.com（holafly 不在 esimdb，单独从官网抓）；
#   founded 事实来源：Yesim 官方新闻(2019 瑞士) / Transatel 官网(Ubigi 品牌
#   2017，NTT 2019 收购) / Roamic=Byte Travel(西班牙, 2021) /
#   aloSIM=AffinityClick(渥太华, 2021)
# ============================================================

[roami]
profile_checked = "2026-10-04"   # 品牌档案（简介/政策/官网事实）核对日
name = "Roami"
founded = 2024
tagline = "App-first travel eSIM with 24/7 activation"
type = "app"
color = "#1A7E6B"
initials = "Ro"
strengths = ["Aggressive pricing across Asia", "No ID verification for travel plans", "24/7 activation and human support", "Auto-switching across all three Japanese networks"]
weaknesses = ["Younger brand with fewer third-party reviews", "Deepest discounts concentrate on 3-30 day plans"]
sponsored = false
# 折扣码：web20（roamiapp.com 官网全站公示：首页横幅 + 各目的地页结账框 + 官方博客）
# 2026-10-04 官方核实：整单 20% off，无任何使用门槛（无最低消费/无新客限制/无套餐类型限制）
promo_rank = 1
promo_code = "web20"
promo_label = "20% off your entire order"
promo_pct = 20
promo_audience = "all"
promo_scope = "Any plan in 200+ destinations — single-country, regional, or unlimited"
promo_min_spend = ""
promo_expires = ""
promo_verified = "2026-10-04"
promo_unconditional = true   # 官方条款零门槛（无最低消费/无新客限制/无套餐类型限制）
# ── 参数总表字段（2026-10-05 第二十九轮新增，全部可追溯到 docs/promos/*.json）──
promo_source = "official"          # official（品牌自己公示）| partner（第三方/聚合站）
promo_source_label = "roamiapp.com"
promo_coverage = "Every plan type — country, regional or unlimited"
promo_uses = "repeatable"
promo_constraints = []
promo_bestfor = "Everyone — the highest discount we track that carries no minimum spend, no customer limits and no plan restrictions"
# 零门槛四条（卡片高亮块逐条渲染；数据驱动，纯英文可见文案）
promo_uncond_short = "No minimum spend · no new-customer rule · no plan restrictions · every order qualifies"
promo_uncond_points = [
  { head = "No minimum spend", sub = "Any order value qualifies — there is no threshold to clear." },
  { head = "No new-customer restriction", sub = "First-time and returning customers get the same 20%." },
  { head = "No plan-type restriction", sub = "Single-country, regional and unlimited plans all qualify." },
  { head = "Every order qualifies", sub = "The code applies at checkout on every purchase, not just once." },
]
promo_terms = "Published by Roami itself (homepage banner and every destination page): apply at checkout for 20% off your entire order. No minimum spend, no new-customer restriction, no plan-type restriction. Bonus: 100MB of free data when you download the Roami app."

# 公司档案（官方页面核验 2026-10-01：terms/privacy/contact/首页/App Store）
[roami.info]
hq = "Hong Kong"
legal = "Hong Kong LinZe Co., Limited"
website = "https://roamiapp.com"
# trustpilot：无 —— 域名过滤搜索 trustpilot.com 无 Roami 档案；自家博客宣称的 4.9 分无档案支撑，不采信
app_android = ""   # 官网有 Play 徽章但无实际链接，Play 商店搜不到 App（截至核验日）
app_ios = "https://apps.apple.com/us/app/roami-esim-global-work-travel/id6747127122"
