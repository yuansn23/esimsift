fup_drop = "1 Mbps"
fup_note = "Roamic states one figure everywhere: 3 GB at full speed in each 24-hour period, then 1 Mbps until the cycle resets. No extra charge and the connection is never cut off. This is the clearest published threshold of any unlimited provider we track."
