{{ define "main" }}
<div class="py-4">
  {{ partial "breadcrumbs.html" . }}
  <header class="mt-4">
    <h1 class="text-3xl font-extrabold tracking-tight md:text-4xl">{{ .Title }}</h1>
  </header>
  {{ with .Content }}<div class="prose prose-slate mt-4 max-w-none">{{ . }}</div>{{ end }}
  {{ with .Pages }}
  <ul class="mt-8 grid gap-3 sm:grid-cols-2">
    {{ range . }}
    <li><a href="{{ .RelPermalink }}" class="card block p-4 font-semibold transition hover:border-indigo-300">{{ .LinkTitle }}</a></li>
    {{ end }}
  </ul>
  {{ end }}
</div>
{{ end }}
